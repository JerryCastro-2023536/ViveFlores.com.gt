<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar Reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/crud.css}">
    <style>
        /* Estilos para el modal */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(10, 30, 43, 0.7); 
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #faf7f0;
            margin: 5% auto; 
            padding: 30px;
            border: none;
            width: 80%;
            max-width: 400px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(10, 30, 43, 0.25);
            border-top: 4px solid #f6b93b;
            animation: modalFadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
            text-align: center;
        }
        @keyframes modalFadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .close {
            color: #6b7c93;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
            position: absolute;
            right: 20px;
            top: 15px;
        }
        .close:hover,
        .close:focus {
            color: #0a1e2b;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments :: errorGlobalNotification}"></div>

<div th:replace="~{fragments :: headerAdmin}"></div>

<main>
    <h2>Gestión de Reportes</h2>

    <div th:if="${error}" style="background-color: #f8d7da; color: #721c24; padding: 15px; margin-bottom: 20px; border: 1px solid #f5c6cb; border-radius: 4px; text-align: center;">
        <p th:text="${error}" style="margin: 0; font-weight: bold;"></p>
    </div>

    <div class="card">
        <form th:action="@{/reportes/guardar}" method="post" style="text-align: left;">
            <label style="font-size: 12px; color: var(--text-light); margin-left: 5px;">Asunto</label>
            <input type="text" name="asunto" required>
            
            <label style="font-size: 12px; color: var(--text-light); margin-left: 5px; margin-top: 10px; display: block;">Mensaje</label>
            <textarea name="mensaje" required></textarea>
            
            <div class="grid-2" style="margin-top: 10px;">
                <div>
                    <label style="font-size: 12px; color: var(--text-light); margin-left: 5px;">Fecha de Envío</label>
                    <input type="datetime-local" name="fechaEnvio" required>
                </div>
                <div>
                    <label style="font-size: 12px; color: var(--text-light); margin-left: 5px;">ID Usuario</label>
                    <input type="number" name="idUsuario" required>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 10px;">
                <button type="submit">Guardar</button>
            </div>
        </form>
        
        <form th:action="@{/reportes/buscar}" method="get" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px dashed rgba(107, 124, 147, 0.3);">
            <input type="number" name="id" placeholder="Buscar por ID" style="max-width: 200px; margin: 0;" required>
            <button type="submit" class="btn-search" style="margin: 0; background: #2b3342; color: white; border-radius: 8px; padding: 12px 18px;">
                <i class="bi bi-search"></i>
            </button>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID Reporte</th>
                    <th>ID Usuario</th>
                    <th>Asunto</th>
                    <th>Mensaje</th>
                    <th>Fecha Envío</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${listaReportes}">
                    <td th:text="${r.id_reporte}"></td>
                    <td th:text="${r.id_usuario}"></td>
                    <td th:text="${r.asunto}"></td>
                    <td th:text="${r.mensaje}"></td>
                    <td th:text="${#temporals.format(r.fecha_envio, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <button type="button" 
                                th:data-url="@{'/reportes/eliminar/' + ${r.id_reporte}}"
                                onclick="openDeleteModal(this.getAttribute('data-url'))">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${listaReportes == null or listaReportes.empty}">
                    <td colspan="6" style="text-align: center; padding: 20px;">No hay reportes pendientes en este momento.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal de Eliminación -->
<div id="deleteModal" class="modal">
    <div class="modal-content" style="position:relative;">
        <span class="close" onclick="closeDeleteModal()">&times;</span>
        <h2 style="color: #0a1e2b; margin-bottom: 15px;">¿Eliminar reporte?</h2>
        <p style="color: #6b7c93; margin-bottom: 25px;">Esta acción no se puede deshacer.</p>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button type="button" onclick="closeDeleteModal()" style="background: #e0e6ed; color: #1a1a2e; box-shadow: none;">Cancelar</button>
            <form id="confirmDeleteForm" method="post" style="margin:0;">
                <button type="submit" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3);">Sí, eliminar</button>
            </form>
        </div>
    </div>
</div>

<script>
    function openDeleteModal(url) {
        document.getElementById('confirmDeleteForm').action = url;
        document.getElementById('deleteModal').style.display = 'block';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }

    window.onclick = function(event) {
        var deleteModal = document.getElementById('deleteModal');
        if (event.target == deleteModal) {
            closeDeleteModal();
        }
    }
</script>
</body>
</html>
