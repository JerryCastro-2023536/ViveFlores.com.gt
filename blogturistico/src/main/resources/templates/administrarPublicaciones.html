<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Administrar Publicaciones</title>
    <link rel='stylesheet' type='text/css' media='screen' href='administrarPublicacion.css'>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments :: headerVendedor}"></div>

<section class="publicaciones">
    <div class="publi-container">

        <div th:each="p : ${publicaciones}" class="card-publicacion">

            <!-- IMAGEN -->
            <div class="img-container">
                <img th:src="@{'/adminpublicaciones/imagen/' + ${p.id_publicacion}}"
                     onerror="this.style.display='none'">
                <div th:if="${p.foto == null}" class="no-img">
                    <i class="bi bi-image"></i>
                </div>
            </div>

            <!-- INFO -->
            <div class="contenido">

                <div class="header-card">
                    <h2 th:text="${p.nombre_publicacion}">Nombre</h2>
                    <span class="estado"
                          th:text="${p.estado_publicacion}"
                          th:classappend="' ' + ${p.estado_publicacion}">
</span>
                </div>

                <p class="descripcion" th:text="${p.descripcion}"></p>

                <div class="datos">
                    <span><i class="bi bi-geo-alt"></i> <span th:text="${p.direccion}"></span></span>
                    <span><i class="bi bi-telephone"></i> <span th:text="${p.telefono}"></span></span>
                    <span><i class="bi bi-clock"></i> <span th:text="${p.horario}"></span></span>
                </div>

                <div class="acciones">

                    <button class="btn btn-warning" th:onclick="'abrirEditarModal(' + ${p.id_publicacion} + ')'">
                        <i class="bi bi-pencil-square"></i>
                    </button>

                    <a th:href="@{'/adminpublicaciones/eliminar/' + ${p.id_publicacion}}">
                        <button class="btn btn-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </a>

                </div>

            </div>

        </div>

    </div>
</section>

<!-- MODAL DE EDICIÓN (POPUP) -->
<div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editarModalLabel" style="font-weight: bold; color: #2c3e50;">Editar Publicación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/vendedor/publicaciones/editar}" method="post" enctype="multipart/form-data">
                <div class="modal-body" style="color: #333; text-align: left;">
                    <!-- ID Oculto -->
                    <input type="hidden" name="id_publicacion" id="edit-id">

                    <!-- Fila 1: Nombre + Teléfono -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 600;">Nombre de la Publicación</label>
                            <input type="text" name="nombre_publicacion" id="edit-nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 600;">Teléfono</label>
                            <input type="number" name="telefono" id="edit-telefono" class="form-control" required>
                        </div>
                    </div>

                    <!-- Fila 2: Horario + Email -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 600;">Horario de Atención</label>
                            <input type="text" name="horario" id="edit-horario" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 600;">Email de Contacto</label>
                            <input type="email" name="email_publicacion" id="edit-email" class="form-control" required>
                        </div>
                    </div>

                    <!-- Fila 3: Dirección + Categoría -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 600;">Dirección</label>
                            <input type="text" name="direccion" id="edit-direccion" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 600;">Categoría</label>
                            <select name="id_categoria" id="edit-categoria" class="form-select" required>
                                <option value="" disabled selected>Seleccionar...</option>
                                <option th:each="cat : ${categorias}" 
                                        th:value="${cat.id_categoria}" 
                                        th:text="${cat.nombre_categoria}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Descripción -->
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 600;">Descripción</label>
                        <textarea name="descripcion" id="edit-descripcion" rows="4" class="form-control" required></textarea>
                    </div>

                    <!-- Imagen -->
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 600;">Actualizar Imagen (opcional)</label>
                        <input type="file" name="archivo" accept="image/*" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success" style="background-color: #27ae60; border-color: #27ae60; color: white; font-weight: bold;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script para el modal popup -->
<script>
    function abrirEditarModal(id) {
        fetch('/vendedor/publicaciones/datos/' + id)
            .then(response => response.json())
            .then(pub => {
                document.getElementById('edit-id').value = pub.id_publicacion;
                document.getElementById('edit-nombre').value = pub.nombre_publicacion;
                document.getElementById('edit-telefono').value = pub.telefono;
                document.getElementById('edit-horario').value = pub.horario;
                document.getElementById('edit-email').value = pub.email_publicacion;
                document.getElementById('edit-direccion').value = pub.direccion;
                document.getElementById('edit-descripcion').value = pub.descripcion;
                document.getElementById('edit-categoria').value = pub.id_categoria;

                // Abrir el modal de Bootstrap
                var myModal = new bootstrap.Modal(document.getElementById('editarModal'));
                myModal.show();
            })
            .catch(error => console.error('Error al obtener datos de la publicación:', error));
    }
</script>

</body>
</html>
