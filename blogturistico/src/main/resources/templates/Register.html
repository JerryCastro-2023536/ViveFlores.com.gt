<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Registro</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='Register.css'>
    <script src='main.js'></script>
</head>
<body>
    <header>
        <div class="logo">Vive Flores</div>
            <nav>
                <ul>
                    <li><a href="/Index/PaginaPrincipal.html">Inicio</a></li>
                    <li><a href="#">Categorias</a></li>
                    <li><a href="#">Eventos</a></li>
                    <li><a href="#">Servicios</a></li>
                    <li><a href="/Index/QuienesSomos.html">¿Quienes Somos?</a></li>
                    <li><a href="/Index/Contacto.html">Contacto</a></li>
                    <li><a href="#">Conviertete en vendedor</a></li>
                </ul>
            </nav>
            <a href="/Index/Login.html"><button class="btn-login">Iniciar Sesión</button></a>
        </div>
    </header>

    <section class="register-container">
        <div class="register-card">
            <h2>Crear Cuenta</h2>
            <form>
                <input type="text" placeholder="Nombre" required>
                <input type="text" placeholder="Apellido" required>
                <input type="email" placeholder="Correo electrónico" required>
                <input type="text" placeholder="Usuario" required>
                <input type="password" placeholder="Contraseña" required>
                <input type="password" placeholder="Confirmar contraseña" required>
                <button type="submit" class="btn-register">Registrarse</button>
            </form>

            <p class="login-text">
                ¿Ya tienes cuenta? <a href="login">Inicia sesión</a>
            </p>
        </div>
        <div class="register-image">
            <img src="/Image/islaRegister.jpg" alt="Isla de Flores">
        </div>

    </section>
</body>
</html>
