<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vive Flores - Crear Publicación</title>
    <link rel="stylesheet" th:href="@{/estilos.css}" />
    <link rel="stylesheet" th:href="@{/subirPublicacion.css}" />
</head>

<body>

    <div th:replace="~{fragments :: headerVendedor}"></div>

    <div class="container">
        <h1>Crear Nueva Publicación</h1>

        <div class="card">
            <form th:action="@{/vendedor/publicaciones/guardar}" method="post" enctype="multipart/form-data">

                <!-- Fila 1: nombre + teléfono + horario -->
                <div class="form-row">
                    <div class="form-group col-2">
                        <label>Nombre de la Publicación</label>
                        <input type="text" name="nombre_publicacion" placeholder="Ej: Arreglo Floral Premium"
                            required />
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="number" name="telefono" placeholder="Ej: 50212345678" required />
                    </div>
                    <div class="form-group">
                        <label>Horario de Atención</label>
                        <input type="text" name="horario" placeholder="Lun–Vie 8:00–18:00" required />
                    </div>
                </div>

                <!-- Fila 2: descripción + dirección + email -->
                <div class="form-row">
                    <div class="form-group col-2">
                        <label>Descripción</label>
                        <textarea name="descripcion" rows="4" placeholder="Describe tu negocio o servicio..."
                            required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" name="direccion" placeholder="Calle, zona, ciudad" required />
                    </div>
                    <div class="form-group">
                        <label>Email de Contacto</label>
                        <input type="email" name="email_publicacion" placeholder="correo@ejemplo.com" required />
                    </div>
                </div>

                <!-- Fila 3: imagen + categoría -->
                <div class="form-row">
                    <div class="form-group col-2">
                        <label>Imagen del Negocio</label>
                        <div class="drop-zone" id="dropZone">
                            <input type="file" name="archivo" accept="image/*" id="fotoInput" class="drop-zone__input" />

                            <div class="drop-zone__content" id="dropContent">
                                <div class="drop-zone__icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                        <polyline points="17 8 12 3 7 8" />
                                        <line x1="12" y1="3" x2="12" y2="15" />
                                    </svg>
                                </div>
                                <p class="drop-zone__text">Arrastra tu imagen aquí</p>
                            </div>

                            <div class="drop-zone__preview" id="previewWrapper" style="display:none;">
                                <img id="foto-preview" class="foto-preview" src="" alt="Vista previa" />
                                <button type="button" class="drop-zone__remove" id="removeBtn"
                                    title="Quitar imagen">&#10005;</button>
                                <p class="drop-zone__filename" id="fileName"></p>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Categoría</label>
                        <select name="id_categoria" required>
                            <option value="" disabled selected>Seleccionar...</option>
                            <option th:each="cat : ${categorias}" 
                                    th:value="${cat.id_categoria}" 
                                    th:text="${cat.nombre_categoria}"></option>
                        </select>
                    </div>
                </div>

                <!-- Acciones -->
                <div class="form-actions">
                    <a class="btn-cancel" th:href="@{/panelvendedor}">Cancelar</a>
                    <button type="submit" class="btn-save">Guardar Publicación</button>
                </div>

            </form>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fotoInput = document.getElementById('fotoInput');
        const dropContent = document.getElementById('dropContent');
        const previewWrap = document.getElementById('previewWrapper');
        const preview = document.getElementById('foto-preview');
        const fileNameEl = document.getElementById('fileName');
        const removeBtn = document.getElementById('removeBtn');
        const MAX_BYTES = 5 * 1024 * 1024;

        function showPreview(file) {
            if (!file) return;
            if (file.size > MAX_BYTES) {
                alert('La imagen supera el límite de 5 MB.');
                fotoInput.value = '';
                return;
            }
            preview.src = URL.createObjectURL(file);
            fileNameEl.textContent = file.name;
            dropContent.style.display = 'none';
            previewWrap.style.display = 'flex';
        }

        function clearPreview() {
            preview.src = '';
            fotoInput.value = '';
            dropContent.style.display = 'flex';
            previewWrap.style.display = 'none';
        }

        fotoInput.addEventListener('change', e => showPreview(e.target.files[0]));
        removeBtn.addEventListener('click', e => { e.stopPropagation(); clearPreview(); });

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const dt = new DataTransfer();
                dt.items.add(file);
                fotoInput.files = dt.files;
                showPreview(file);
            }
        });
    </script>

</body>

</html>
