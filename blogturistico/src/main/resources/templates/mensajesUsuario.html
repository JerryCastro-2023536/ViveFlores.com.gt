<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/mensajesUsuario.css(v=1.1)}">
    <link rel="stylesheet" th:href="@{/index.css(v=1.1)}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Mis Mensajes</title>
</head>
<body>
<div th:replace="~{fragments :: headerUsuario}"></div>

<main class="mensajes-container">
    <div class="header-section">
        <h2><i class="bi bi-envelope-paper-fill"></i> Mis Mensajes Enviados</h2>
        <p>Revisa las respuestas de los vendedores a tus consultas</p>
    </div>

    <div class="tabla-mensajes">
        <div class="grid-header" style="grid-template-columns: 2fr 3fr 3fr 1.5fr;">
            <span>Asunto / Publicación</span>
            <span>Mi Mensaje</span>
            <span>Respuesta del Vendedor</span>
            <span>Fecha Envío</span>
        </div>

        <div class="grid-row" th:each="info : ${listaContactos}" style="grid-template-columns: 2fr 3fr 3fr 1.5fr;">
            <div class="asunto-info">
                <strong th:text="${info[0].asunto}">Asunto</strong>
                <a th:href="@{'/post/' + ${info[0].id_publicacion}}" style="text-decoration:none;">
                    <small th:text="${info[1]}" style="color:var(--navy); font-weight:bold; border-bottom:1px dashed var(--navy);">Nombre de la Publicación</small>
                </a>
            </div>

            <div class="mensaje-preview">
                <p th:text="${info[0].mensaje}" style="-webkit-line-clamp: unset;"></p>
            </div>

            <div class="mensaje-preview" style="background:#f5f6fa; padding:10px; border-radius:8px;">
                <p th:if="${info[0].respuesta != null}" th:text="${info[0].respuesta}" style="color:var(--deep); -webkit-line-clamp: unset;"></p>
                <p th:if="${info[0].respuesta == null}" style="color:#aaa; font-style:italic;">Esperando respuesta...</p>
            </div>

            <div class="fecha-info">
                <span th:text="${#temporals.format(info[0].fecha_envio, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
            </div>
        </div>

        <div class="no-mensajes" th:if="${listaContactos == null or listaContactos.empty}">
            <i class="bi bi-inbox"></i>
            <p>Aún no has enviado mensajes a los vendedores.</p>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
