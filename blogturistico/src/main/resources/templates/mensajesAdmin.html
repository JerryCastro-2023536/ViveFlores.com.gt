<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../static/mensajesAdmin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <title>Vive Flores - Mensajes</title>
</head>
<body>

<header>
    <div class="logo">Vive Flores</div>
    <nav>
        <button id="btn-regresar" onclick="window.history.back()"> 
            <i class="bi bi-arrow-left"></i> Volver al inicio
        </button>
    </nav>
</header>

<main class="mensajes-container">

    <div class="header-section">
        <h2><i class="bi bi-chat-dots-fill"></i> Mensajes Recibidos</h2>
        <p>Tienes 2 mensajes nuevos</p>
    </div>

    <div class="tabla-mensajes">
        <div class="grid-header">
            <span>Cliente</span>
            <span>Asunto</span>
            <span>Mensaje</span>
            <span>Fecha</span>
            <span>Acción</span>
        </div>

        <!-- MENSAJE 1 -->
        <div class="grid-row">
            <div class="cliente-info">
                <i class="bi bi-person-circle"></i>
                <span>Juan Pérez</span>
            </div>

            <div class="asunto-info">
                <strong>Consulta de disponibilidad</strong>
                <small>Paquetes turísticos</small>
            </div>

            <div class="mensaje-preview">
                <p>Solicito información sobre paquetes turísticos para el mes de junio...</p>
            </div>

            <div class="fecha-info">
                <span>Hoy, 14:30</span>
            </div>

            <div class="acciones">
                <button class="btn-responder" title="Leer mensaje">
                    <i class="bi bi-eye-fill"></i>
                </button>

                <button class="btn-eliminar" onclick="return confirm('¿Eliminar este mensaje?')">
                    <i class="bi bi-trash3-fill"></i>
                </button>
            </div>
        </div>

    </div>

</main>

</body>
</html>
