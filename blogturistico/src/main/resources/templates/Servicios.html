<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios</title>
    <link rel="stylesheet" type="text/css" href="Cards.css">
    <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>

    <header>
        <div class="logo">Vive Flores</div>
        <nav>
            <ul>
                <li><a href="index">Inicio</a></li>
                <li><a href="#">Categorias</a></li>
                <li><a href="publicacionesAll">Publicaciones</a></li>
                <li><a href="eventosAll">Eventos</a></li>
                <li><a href="serviciosAll">Servicios</a></li>
                <li><a href="quienessomos">¿Quiénes Somos?</a></li>
                <li><a href="contacto">Contacto</a></li>
                <li><a href="#">Conviértete en vendedor</a></li>
            </ul>
        </nav>
        <a href="acceder"><button class="btn-login">Iniciar Sesión</button></a>
    </header>

    <section class="hero-small">
        <h1>Servicios</h1>
        <p>Encuentra los mejores servicios en la Isla de Flores, Petén</p>
    </section>

    <section class="eventos-container">
        <div class="evento-card"  th:each="s : ${servicios}">
            <div class="evento-image">
                <img th:src="@{'/servicios/foto/' + ${s.id_servicio}}" alt="Imagen servicio">
            </div>
            <div class="evento-body">
                <h3 th:text="${s.nombre_servicio}"></h3>
                <p th:text="${s.descripcion}"></p>
                <div class="evento-detalles">
                    <div class="detalle">
                        <span class="label">Teléfono:</span>
                        <span th:text="${s.telefono}"></span>
                    </div>
                    <div class="detalle">
                        <span class="label">Fecha de creación:</span>
                        <span th:text="${s.fecha_creacion}"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Vive Flores — Isla de Flores, Petén, Guatemala</p>
    </footer>

</body>
</html>
