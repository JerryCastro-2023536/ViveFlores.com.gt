<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favoritos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="crud.css">
    <style>
        /* Estilos para el modal */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(10, 30, 43, 0.7); 
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #faf7f0;
            margin: 5% auto; 
            padding: 30px;
            border: none;
            width: 80%;
            max-width: 800px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(10, 30, 43, 0.25);
            border-top: 4px solid #f6b93b;
            animation: modalFadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes modalFadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .close {
            color: #6b7c93;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .close:hover,
        .close:focus {
            color: #0a1e2b;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Vive Flores</h1>
        <a href="#" class="btn-volver">← Volver al inicio</a>
    </header>

    <main>
        <h2>Gestión de Favoritos</h2>

        <div class="card">
            <form th:action="@{/saveFavorito}" method="post">
                <div class="grid-3">
                    <input type="number" placeholder="ID Usuario" name="idUsuario">
                    <input type="number" placeholder="ID Publicación" name="idPublicacion">
                    <input type="number" placeholder="ID Categoría" name="idCategoria">
                </div>

                <button type="submit">Guardar</button>
            </form>
            <form th:action="@{/searchFavorito}" method="post">
                <input type="number" id="id" name="id" placeholder="Buscar por código" required>
                <button type="submit" class="btn-search" id="btn-buscar">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ID Usuario</th>
                        <th>ID Publicación</th>
                        <th>ID Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${favoritos}">
                        <td th:text="${f.id_favorito}"></td>
                        <td th:text="${f.id_usuario}"></td>
                        <td th:text="${f.id_publicacion}"></td>
                        <td th:text="${f.id_categoria}"></td>
                        <td>
                            <button type="button" 
                                    th:data-id="${f.id_favorito}"
                                    th:data-usuario="${f.id_usuario}"
                                    th:data-publicacion="${f.id_publicacion}"
                                    th:data-categoria="${f.id_categoria}"
                                    onclick="openEditModal(this)">Editar</button>
                            <button type="button" 
                                    th:data-url="@{'/deleteFavorito/' + ${f.id_favorito}}"
                                    onclick="openDeleteModal(this.getAttribute('data-url'))">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Modal de Edición -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Editar Favorito</h2>
            <form th:action="@{/updateFavorito}" method="post">
                <input type="hidden" id="edit-id" name="id">
                
                <div class="grid-3">
                    <input type="number" placeholder="ID Usuario" id="edit-usuario" name="idUsuario">
                    <input type="number" placeholder="ID Publicación" id="edit-publicacion" name="idPublicacion">
                    <input type="number" placeholder="ID Categoría" id="edit-categoria" name="idCategoria">
                </div>

                <button type="submit" style="margin-top: 15px;">Actualizar Favorito</button>
            </form>
        </div>
    </div>

    <!-- Modal de Eliminación -->
    <div id="deleteModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <span class="close" onclick="closeDeleteModal()">&times;</span>
            <h2 style="color: #0a1e2b; margin-bottom: 15px;">¿Eliminar registro?</h2>
            <p style="color: #6b7c93; margin-bottom: 25px;">Esta acción no se puede deshacer.</p>
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button type="button" onclick="closeDeleteModal()" style="background: #e0e6ed; color: #1a1a2e; box-shadow: none;">Cancelar</button>
                <a id="confirmDeleteBtn" href="#">
                    <button type="button" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3);">Sí, eliminar</button>
                </a>
            </div>
        </div>
    </div>

    <script>
        function openEditModal(btn) {
            document.getElementById('edit-id').value = btn.getAttribute('data-id');
            document.getElementById('edit-usuario').value = btn.getAttribute('data-usuario');
            document.getElementById('edit-publicacion').value = btn.getAttribute('data-publicacion');
            document.getElementById('edit-categoria').value = btn.getAttribute('data-categoria');
            
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function openDeleteModal(url) {
            document.getElementById('confirmDeleteBtn').href = url;
            document.getElementById('deleteModal').style.display = 'block';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        window.onclick = function(event) {
            var editModal = document.getElementById('editModal');
            var deleteModal = document.getElementById('deleteModal');
            if (event.target == editModal) {
                closeEditModal();
            }
            if (event.target == deleteModal) {
                closeDeleteModal();
            }
        }
    </script>
</body>

</html>
