<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favoritos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="crud.css">
</head>

<body>

    <header>
        <h1>Vive Flores</h1>
        <a href="#" class="btn-volver">← Volver al inicio</a>
    </header>

    <main>
        <h2>Gestión de Favoritos</h2>

        <div class="card">
            <form th:action="@{/saveFavorito}" method="post">
                <div class="grid-3">
                    <input type="number" placeholder="ID Usuario" name="idUsuario">
                    <input type="number" placeholder="ID Publicación" name="idPublicacion">
                    <input type="number" placeholder="ID Categoría" name="idCategoria">
                </div>

                <button type="submit">Guardar</button>
            </form>
            <form th:action="@{/searchFavorito}" method="post">
                <input type="number" id="id" name="id" placeholder="Buscar por código" required>
                <button type="submit" class="btn-search" id="btn-buscar">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ID Usuario</th>
                    <th>ID Publicación</th>
                    <th>ID Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${favoritos}">
                    <td th:text="${f.id_favorito}"></td>
                    <td th:text="${f.id_usuario}"></td>
                    <td th:text="${f.id_publicacion}"></td>
                    <td th:text="${f.id_categoria}"></td>
                    <td>
                        <button>Editar</button>
                        <a th:href="@{'/deleteFavorito/' + ${f.id_favorito}}">
                            <button><i class="bi bi-trash"></i></button>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </main>

</body>

</html>
