<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Publicación</title>

    <link rel="stylesheet" th:href="@{/Styles/editarPublicacion.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<header class="main-header">
    <div class="logo">Vive Flores</div>

    <nav>
        <a th:href="@{/adminpublicaciones}">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </nav>
</header>

<div class="container">

    <h2 class="titulo">Editar Publicación</h2>

    <form th:action="@{/adminpublicaciones/guardar}"
          th:object="${publicacion}"
          method="post"
          <!--enctype="multipart/form-data">-->

        <!-- IMPORTANTES -->
        <input type="hidden" th:field="*{id_publicacion}">
        <input type="hidden" th:field="*{fecha_creacion}">

        <div class="form-grid">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre_publicacion}" required>
            </div>

            <div class="form-group">
                <label>Teléfono</label>
                <input type="number" th:field="*{telefono}" required>
            </div>

            <div class="form-group full">
                <label>Descripción</label>
                <textarea th:field="*{descripcion}" required></textarea>
            </div>

            <div class="form-group">
                <label>Dirección</label>
                <input type="text" th:field="*{direccion}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email_publicacion}" required>
            </div>

            <div class="form-group">
                <label>Horario</label>
                <input type="text" th:field="*{horario}" required>
            </div>

            <div class="form-group">
                <label>Estado</label>
                <select th:field="*{estado_publicacion}">
                    <option value="activo">Activo</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </div>

            <div class="form-group">
                <label>ID Categoría</label>
                <input type="number" th:field="*{id_categoria}" required>
            </div>

            <div class="form-group">
                <label>ID Usuario</label>
                <input type="number" th:field="*{id_usuario}" required>
            </div>

            <div class="form-group full">
                <label>Foto (opcional)</label>
                <!--<input type="file" name="archivo">-->
            </div>

        </div>

        <button type="submit">
            <i class="bi bi-save"></i> Guardar cambios
        </button>

    </form>

</div>

</body>
</html>
