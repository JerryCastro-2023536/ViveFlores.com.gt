<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/favoritosUsuario.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Vive Flores - Favoritos</title>
</head>
<body>
    <header>
        <div class="logo">Vive Flores</div>
        <nav>
            <button id="btn-regresar" onclick="window.history.back()"> 
                <i class="bi bi-arrow-left"></i> volver al inicio
            </button>
        </nav>
    </header>

    <main class="favoritos-main">
        <h2>Tus Favoritos</h2>

        <div class="favoritos-container">
            <div class="fav-item">
                <div class="fav-content">
                    <div class="fav-text">
                        <h3>Publicación 1</h3>
                        <p>Descripción de la publicación 1. Aquí puedes ver los detalles de lo que guardaste.</p>
                    </div>
                    <div class="fav-action">
                        <i class="bi bi-star-fill star-icon"></i>
                    </div>
                </div>
            </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.querySelectorAll('.star-icon').forEach(star => {
            star.addEventListener('click', function() {
                this.classList.toggle('bi-star-fill');
                this.classList.toggle('bi-star');
                
                const card = this.closest('.fav-item');
                if (this.classList.contains('bi-star')) {
                    card.style.opacity = '0.5';
                    card.style.filter = 'grayscale(1)';
                } else {
                    card.style.opacity = '1';
                    card.style.filter = 'grayscale(0)';
                }
            });
        });
    </script>
</body>
</html>
