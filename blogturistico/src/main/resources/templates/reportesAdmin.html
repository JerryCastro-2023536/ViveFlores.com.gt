<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Vive Flores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/reportesAdmin.css}">
</head>
<body>
<div th:replace="~{fragments :: errorGlobalNotification}"></div>

<header>
    <h1>Vive Flores</h1>
    <a th:href="@{/index}" class="btn-volver">Volver al Panel</a>
</header>

<main>
    <h2>Buzón de Reportes de Usuarios</h2>


    <div class="reports-list">
        <div class="report-card-horizontal" th:each="r : ${reportes}">

            <div class="report-main-content">
                <div class="report-details">
                    <h3 th:text="${r.asunto}">Asunto del reporte</h3>
                    <p class="user-info">
                        <i class="bi bi-person"></i> ID Usuario: <span th:text="${r.id_usuario}">0</span>
                    </p>
                    <p class="message-text" th:text="${r.mensaje}">Mensaje del usuario...</p>
                    <span class="report-date" th:text="${#temporals.format(r.fecha_envio, 'dd/MM/yyyy HH:mm')}">00/00/0000</span>
                </div>

                <a th:href="@{/reportes/eliminar/{id}(id=${r.id_reporte})}"
                   class="btn-delete"
                   onclick="return confirm('¿Estás seguro de eliminar este reporte?')">
                    <i class="bi bi-trash"></i>
                </a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(reportes)}" style="text-align: center; padding: 20px;">
            <p>No hay reportes pendientes.</p>
        </div>
    </div>
</main>

</body>
</html>
