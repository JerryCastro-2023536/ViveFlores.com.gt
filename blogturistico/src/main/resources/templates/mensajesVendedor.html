<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mensajesVendedor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Bandeja de Entrada</title>
</head>
<body>
<div th:replace="~{fragments :: headerVendedor}"></div>

<main class="mensajes-container">
    <div class="header-section">
        <h2><i class="bi bi-chat-dots-fill"></i> Mensajes de Clientes</h2>
        <p>Gestiona las consultas sobre tus publicaciones</p>
    </div>

    <div class="tabla-mensajes">
        <div class="grid-header">
            <span>Cliente</span>
            <span>Asunto / Publicación</span>
            <span>Mensaje</span>
            <span>Fecha</span>
            <span>Acción</span>
        </div>

        <div class="grid-row" th:each="info : ${listaContactos}">
            <div class="cliente-info">
                <i class="bi bi-person-circle"></i>
                <span th:text="'ID Usuario Remitente: ' + ${info[0].id_usuario}">Nombre Cliente</span>
            </div>

            <div class="asunto-info">
                <strong th:text="${info[0].asunto}">Asunto</strong>
                <small th:text="${info[1]}">Nombre de la Publicación</small>
            </div>

            <div class="mensaje-preview">
                <p th:text="${info[0].mensaje}">Contenido del mensaje...</p>
            </div>

            <div class="fecha-info">
                <span th:text="${#temporals.format(info[0].fecha_envio, 'dd/MM/yyyy')}">01/01/2026</span>
            </div>

            <div class="acciones">
                <a class="btn-responder" title="Responder">
                    <i class="bi bi-reply-fill"></i>
                </a>
                <form style="display:inline;">
                    <button type="submit" class="btn-eliminar" onclick="return confirm('¿Eliminar este mensaje?')">
                        <i class="bi bi-trash3-fill"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="no-mensajes" th:if="${listaContactos == null or listaContactos.empty}">
            <i class="bi bi-inbox"></i>
            <p>No tienes mensajes nuevos en este momento.</p>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
