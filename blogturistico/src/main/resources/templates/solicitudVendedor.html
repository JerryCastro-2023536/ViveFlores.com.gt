<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Solicitudes de Vendedor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" th:href="@{/solicitudPublicacion.css}">
</head>
<body>
<div th:replace="~{fragments :: errorGlobalNotification}"></div>
<div th:replace="~{fragments :: headerAdmin}"></div>

<main>
    <h2>Solicitudes de Vendedor</h2>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>ID Solicitud</th>
                <th>Fecha de Solicitud</th>
                <th>Estado</th>
                <th>Detalles de la Solicitud</th>
                <th>ID Usuario</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${solicitudes}">
                <td th:text="${s.id_solicitud}"></td>
                <td th:text="${s.fecha_solicitud}"></td>
                <td>
                    <span class="status-badge" th:text="${s.estado}" 
                          th:style="${#strings.equalsIgnoreCase(s.estado, 'pendiente') ? 'background: #f1c40f; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold;' : 
                                    (#strings.equalsIgnoreCase(s.estado, 'aprobada') ? 'background: #2ecc71; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold;' : 
                                     'background: #e74c3c; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold;')}">
                    </span>
                </td>
                <td th:text="${s.descripcion}"></td>
                <td th:text="${s.id_usuario}"></td>
                <td>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <a th:if="${#strings.equalsIgnoreCase(s.estado, 'pendiente')}" 
                           th:href="@{'/solicitudVendedor/aprobar/' + ${s.id_solicitud}}" 
                           style="background: #27ae60; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px;">
                            <i class="bi bi-check-circle-fill"></i> Aprobar
                        </a>
                        <a th:if="${#strings.equalsIgnoreCase(s.estado, 'pendiente')}" 
                           th:href="@{'/solicitudVendedor/rechazar/' + ${s.id_solicitud}}" 
                           style="background: #c0392b; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px;">
                            <i class="bi bi-x-circle-fill"></i> Rechazar
                        </a>
                        
                        <button type="button" class="btn-delete-icon" style="background: transparent; border: none; color: #e74c3c; cursor: pointer; font-size: 18px;"
                                th:onclick="'openDeleteModal(\'/solicitudVendedor/eliminar/' + ${s.id_solicitud} + '\')'">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(solicitudes)}">
                <td colspan="6" style="text-align: center; color: #6b7c93; padding: 20px;">No hay solicitudes de vendedor registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div id="deleteModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center;">
    <div class="modal-content" style="background-color: #fefefe; margin: auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 400px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <span class="close" onclick="closeDeleteModal()" style="color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>
        <h2 style="color: #0a1e2b; margin-bottom: 15px; font-size: 20px;">¿Eliminar solicitud?</h2>
        <p style="color: #6b7c93; margin-bottom: 25px; font-size: 14px;">Esta acción borrará el registro permanentemente.</p>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button type="button" onclick="closeDeleteModal()" style="background: #e2e8f0; color: #4a5568; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">Cancelar</button>
            <a id="confirmDeleteBtn" href="#">
                <button type="button" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">Sí, eliminar</button>
            </a>
        </div>
    </div>
</div>

<script>
    function openDeleteModal(url) {
        document.getElementById('confirmDeleteBtn').href = url;
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }

    window.onclick = function(event) {
        var deleteModal = document.getElementById('deleteModal');
        if (event.target == deleteModal) closeDeleteModal();
    }
</script>
</body>
</html>
