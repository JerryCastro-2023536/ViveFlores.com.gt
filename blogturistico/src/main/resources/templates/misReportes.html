<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/mensajesVendedor.css(v=1.1)}">
    <link rel="stylesheet" th:href="@{/index.css(v=1.1)}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Mis Reportes</title>
</head>
<body>
<div th:replace="~{fragments :: headerNormal}"></div>

<main class="mensajes-container">
    <div class="header-section">
        <h2><i class="bi bi-exclamation-triangle-fill" style="color:var(--gold);"></i> Mis Reportes Enviados</h2>
        <p>Revisa el estado de tus reportes de problemas o sugerencias enviados al administrador</p>
    </div>

    <div class="tabla-mensajes">
        <div class="grid-header" style="grid-template-columns: 2fr 3fr 3fr 1.5fr;">
            <span>Asunto</span>
            <span>Mi Mensaje</span>
            <span>Respuesta del Admin</span>
            <span>Fecha Envío</span>
        </div>

        <div class="grid-row" th:each="r : ${listaReportes}" style="grid-template-columns: 2fr 3fr 3fr 1.5fr;">
            <div class="asunto-info">
                <strong th:text="${r.asunto}">Asunto</strong>
            </div>

            <div class="mensaje-preview">
                <p th:text="${r.mensaje}" style="-webkit-line-clamp: unset;"></p>
            </div>

            <div class="mensaje-preview" style="background:#f5f6fa; padding:10px; border-radius:8px;">
                <p th:if="${r.respuesta != null}" th:text="${r.respuesta}" style="color:var(--deep); -webkit-line-clamp: unset;"></p>
                <p th:if="${r.respuesta == null}" style="color:#aaa; font-style:italic;">Esperando respuesta...</p>
            </div>

            <div class="fecha-info">
                <span th:text="${#temporals.format(r.fecha_envio, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
            </div>
        </div>

        <div class="no-mensajes" th:if="${listaReportes == null or listaReportes.empty}">
            <i class="bi bi-check-circle-fill"></i>
            <p>No tienes reportes enviados. ¡Todo en orden!</p>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
