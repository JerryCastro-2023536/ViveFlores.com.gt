<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Gestión de Categorías</title>
    <link rel="stylesheet" href="/css/estilos.css"    th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/categorias.css" th:href="@{/css/categorias.css}"/>
</head>
<body>

<nav>
    <span class="brand">Vive Flores</span>
    <a class="btn-back" href="/">&#8592; Volver al inicio</a>
</nav>

<div class="container">
    <h1>Gestión de Categorías</h1>

    <!-- FORM CARD -->
    <div class="card">
        <!-- SAVE FORM -->
        <form th:if="${!modoEdicion}" th:action="@{/categorias/guardar}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre de Categoría</label>
                    <input type="text" name="nombre_categoria" th:value="${categoria.nombre_categoria}"
                           placeholder="Nombre de categoría" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" placeholder="Descripción de la categoría..." required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>

        <!-- EDIT FORM -->
        <form th:if="${modoEdicion}" th:action="@{/categorias/actualizar/{id}(id=${categoria.id_categoria})}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre de Categoría</label>
                    <input type="text" name="nombre_categoria" th:value="${categoria.nombre_categoria}"
                           placeholder="Nombre de categoría" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" th:text="${categoria.descripcion}" required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <a class="btn-cancel" href="/categorias">Cancelar</a>
                <button type="submit" class="btn-save">Actualizar</button>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre Categoría</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="4" class="empty-row">No hay categorías registradas.</td>
            </tr>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.id_categoria}"></td>
                <td th:text="${cat.nombre_categoria}"></td>
                <td th:text="${cat.descripcion}"></td>
                <td>
                    <a class="btn-edit" th:href="@{/categorias/editar/{id}(id=${cat.id_categoria})}">Editar</a>
                    <a class="btn-delete" th:href="@{/categorias/eliminar/{id}(id=${cat.id_categoria})}"
                       onclick="return confirm('¿Eliminar esta categoría?')">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
