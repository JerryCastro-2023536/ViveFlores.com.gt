<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Gestión de Categorías</title>
    <link rel="stylesheet" href="/css/estilos.css"    th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/categorias.css" th:href="@{/css/categorias.css}"/>
</head>
<body>

<nav>
    <span class="brand">Vive Flores</span>
    <a class="btn-back" href="/">&#8592; Volver al inicio</a>
</nav>

<div class="container">
    <h1>Gestión de Categorías</h1>

    <!-- FORM CARD -->
    <div class="card">
        <!-- SAVE FORM -->
        <form th:if="${!modoEdicion}" th:action="@{/categorias/guardar}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre de Categoría</label>
                    <input type="text" name="nombre_categoria" th:value="${categoria.nombre_categoria}"
                           placeholder="Nombre de categoría" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" placeholder="Descripción de la categoría..." required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>

        <!-- EDIT FORM -->
        <form th:if="${modoEdicion}" th:action="@{/categorias/actualizar/{id}(id=${categoria.id_categoria})}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre de Categoría</label>
                    <input type="text" name="nombre_categoria" th:value="${categoria.nombre_categoria}"
                           placeholder="Nombre de categoría" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" th:text="${categoria.descripcion}" required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <a class="btn-cancel" href="/categorias">Cancelar</a>
                <button type="submit" class="btn-save">Actualizar</button>
            </div>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="search-bar">
        <span class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span>
        <input type="text" id="buscador" placeholder="Buscar categoría..." oninput="filtrarTabla()"/>
        <button class="btn-clear" id="btnLimpiar" onclick="limpiarBusqueda()" style="display:none" title="Limpiar">&#x2715;</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <table id="tablaCategorias">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre Categoría</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="4" class="empty-row">No hay categorías registradas.</td>
            </tr>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.id_categoria}"></td>
                <td th:text="${cat.nombre_categoria}"></td>
                <td th:text="${cat.descripcion}"></td>
                <td>
                    <a class="btn-edit" th:href="@{/categorias/editar/{id}(id=${cat.id_categoria})}" title="Editar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </a>
                    <a class="btn-delete" th:href="@{/categorias/eliminar/{id}(id=${cat.id_categoria})}"
                       onclick="return confirm('¿Eliminar esta categoría?')" title="Eliminar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14H6L5 6h14z"/>
                            <path d="M10 11v6M14 11v6"/>
                            <path d="M9 6V4h6v2"/>
                        </svg>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
        <p id="sinResultados" class="empty-row" style="display:none; padding:22px; text-align:center; color:#999;">
            No se encontraron coincidencias.
        </p>
    </div>
</div>

<script>
    function filtrarTabla() {
        const valor = document.getElementById('buscador').value.toLowerCase();
        const filas = document.querySelectorAll('#tablaCategorias tbody tr');
        const btnLimpiar = document.getElementById('btnLimpiar');
        let visibles = 0;

        btnLimpiar.style.display = valor ? 'inline-flex' : 'none';

        filas.forEach(fila => {
            if (fila.classList.contains('empty-row') || fila.querySelector('.empty-row')) {
                fila.style.display = 'none';
                return;
            }
            const texto = fila.textContent.toLowerCase();
            const coincide = texto.includes(valor);
            fila.style.display = coincide ? '' : 'none';
            if (coincide) visibles++;
        });

        document.getElementById('sinResultados').style.display = (visibles === 0 && valor) ? 'block' : 'none';
    }

    function limpiarBusqueda() {
        document.getElementById('buscador').value = '';
        filtrarTabla();
        document.getElementById('buscador').focus();
    }
</script>

</body>
</html>
