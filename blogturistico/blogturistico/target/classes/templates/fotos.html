<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Gestión de Fotos</title>
    <link rel="stylesheet" href="/css/estilos.css" th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/fotos.css"   th:href="@{/css/fotos.css}"/>
</head>
<body>

<nav>
    <span class="brand">Vive Flores</span>
    <a class="btn-back" href="/">&#8592; Volver al inicio</a>
</nav>

<div class="container">
    <h1>Gestión de Fotos</h1>

    <!-- FORM CARD — sólo para guardar nuevos registros -->
    <div class="card">
        <form th:action="@{/fotos/guardar}" method="post" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label>Título de la Foto</label>
                    <input type="text" name="titulo_foto" placeholder="Título" required/>
                </div>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" name="id_usuario" placeholder="ID Usuario" required/>
                </div>
                <div class="form-group">
                    <label>Fecha de Creación</label>
                    <input type="date" name="fecha_creacion" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" placeholder="Descripción de la foto..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Archivo de Imagen</label>
                    <input type="file" name="archivo" accept="image/*"/>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="search-wrapper">
        <div class="search-bar">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Buscar foto..." oninput="filterTable()"/>
            <button class="btn-clear" id="btnClear" onclick="clearSearch()" style="display:none;" title="Limpiar">&#10005;</button>
        </div>
        <button class="btn-search" onclick="filterTable()" title="Buscar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Descripción</th>
                <th>Imagen</th>
                <th>Fecha Creación</th>
                <th>ID Usuario</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(fotos)}">
                <td colspan="7" class="empty-row">No hay fotos registradas.</td>
            </tr>
            <tr th:each="f : ${fotos}">
                <td th:text="${f.id_foto}"></td>
                <td th:text="${f.titulo_foto}"></td>
                <td th:text="${f.descripcion}"></td>
                <td>
                    <img th:if="${f.foto != null}" class="thumb"
                         th:src="@{/fotos/imagen/{id}(id=${f.id_foto})}" alt="foto"/>
                    <span th:unless="${f.foto != null}" class="no-img">Sin imagen</span>
                </td>
                <td th:text="${#temporals.format(f.fecha_creacion, 'dd/MM/yyyy')}"></td>
                <td th:text="${f.id_usuario}"></td>
                <td>
                    <button type="button"
                            class="btn-edit"
                            th:data-id="${f.id_foto}"
                            th:data-titulo="${f.titulo_foto}"
                            th:data-descripcion="${f.descripcion}"
                            th:data-fecha="${#temporals.format(f.fecha_creacion, 'yyyy-MM-dd')}"
                            th:data-usuario="${f.id_usuario}"
                            th:data-tiene-foto="${f.foto != null}"
                            onclick="openEditModal(this)">Editar</button>

                    <button type="button"
                            class="btn-delete"
                            th:data-url="@{'/fotos/eliminar/' + ${f.id_foto}}"
                            onclick="openDeleteModal(this.getAttribute('data-url'))">Eliminar</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== Modal de Eliminación ===== -->
<div id="deleteModal" class="modal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <span class="close" onclick="closeDeleteModal()">&times;</span>
        <h2 style="color: #0a1e2b; margin-bottom: 15px;">¿Eliminar foto?</h2>
        <p style="color: #6b7c93; margin-bottom: 25px;">Esta acción no se puede deshacer.</p>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button type="button" class="btn-modal-cancel" onclick="closeDeleteModal()">Cancelar</button>
            <a id="confirmDeleteBtn" href="#">
                <button type="button" class="btn-confirm-delete">Sí, eliminar</button>
            </a>
        </div>
    </div>
</div>

<!-- ===== Modal de Edición ===== -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h2>Editar Foto</h2>
        <form id="editForm" method="post" enctype="multipart/form-data">
            <input type="hidden" id="edit-id" name="id"/>

            <div class="form-row">
                <div class="form-group">
                    <label>Título de la Foto</label>
                    <input type="text" id="edit-titulo" name="titulo_foto" placeholder="Título" required/>
                </div>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" id="edit-usuario" name="id_usuario" placeholder="ID Usuario" required/>
                </div>
                <div class="form-group">
                    <label>Fecha de Creación</label>
                    <input type="date" id="edit-fecha" name="fecha_creacion" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="edit-descripcion" name="descripcion"
                              placeholder="Descripción de la foto..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Nueva Imagen <span class="hint">(dejar vacío para conservar la actual)</span></label>
                    <input type="file" name="archivo" accept="image/*"/>
                    <img id="edit-preview" class="preview-actual" src="" alt="imagen actual"
                         style="display:none; margin-top: 8px;"/>
                </div>
            </div>

            <button type="submit" style="margin-top: 15px;">Actualizar Foto</button>
        </form>
    </div>
</div>

<script>
    function filterTable() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.getElementById('btnClear').style.display = q ? 'inline-flex' : 'none';
        const rows = document.querySelectorAll('#mainTable tbody tr:not(.empty-row-js)');
        let visible = 0;
        rows.forEach(row => {
            const show = row.innerText.toLowerCase().includes(q);
            row.style.display = show ? '' : 'none';
            if (show) visible++;
        });
        let noResult = document.getElementById('noResultRow');
        if (!visible) {
            if (!noResult) {
                noResult = document.createElement('tr');
                noResult.id = 'noResultRow';
                noResult.classList.add('empty-row-js');
                noResult.innerHTML = '<td colspan="7" class="empty-row">No se encontraron resultados.</td>';
                document.querySelector('#mainTable tbody').appendChild(noResult);
            }
            noResult.style.display = '';
        } else if (noResult) { noResult.style.display = 'none'; }
    }
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        filterTable();
    }
    function openEditModal(btn) {
        const id = btn.getAttribute('data-id');
        document.getElementById('edit-id').value          = id;
        document.getElementById('edit-titulo').value      = btn.getAttribute('data-titulo');
        document.getElementById('edit-descripcion').value = btn.getAttribute('data-descripcion');
        document.getElementById('edit-fecha').value       = btn.getAttribute('data-fecha');
        document.getElementById('edit-usuario').value     = btn.getAttribute('data-usuario');
        document.getElementById('editForm').action        = '/fotos/actualizar/' + id;

        // Mostrar vista previa si tiene imagen
        const preview = document.getElementById('edit-preview');
        if (btn.getAttribute('data-tiene-foto') === 'true') {
            preview.src = '/fotos/imagen/' + id;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }

        document.getElementById('editModal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function openDeleteModal(url) {
        document.getElementById('confirmDeleteBtn').href = url;
        document.getElementById('deleteModal').style.display = 'block';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const editModal   = document.getElementById('editModal');
        const deleteModal = document.getElementById('deleteModal');
        if (event.target === editModal)   closeEditModal();
        if (event.target === deleteModal) closeDeleteModal();
    };
</script>

</body>
</html>
