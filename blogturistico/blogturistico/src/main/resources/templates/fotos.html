<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Gestión de Fotos</title>
    <link rel="stylesheet" href="/css/estilos.css" th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/fotos.css"   th:href="@{/css/fotos.css}"/>
</head>
<body>

<nav>
    <span class="brand">Vive Flores</span>
    <a class="btn-back" href="/">&#8592; Volver al inicio</a>
</nav>

<div class="container">
    <h1>Gestión de Fotos</h1>

    <!-- FORM CARD -->
    <div class="card">
        <!-- SAVE FORM -->
        <form th:if="${!modoEdicion}" th:action="@{/fotos/guardar}" method="post" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label>Título de la Foto</label>
                    <input type="text" name="titulo_foto" placeholder="Título" required/>
                </div>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" name="id_usuario" placeholder="ID Usuario" required/>
                </div>
                <div class="form-group">
                    <label>Fecha de Creación</label>
                    <input type="date" name="fecha_creacion" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" placeholder="Descripción de la foto..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Archivo de Imagen</label>
                    <input type="file" name="archivo" accept="image/*"/>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>

        <!-- EDIT FORM -->
        <form th:if="${modoEdicion}" th:action="@{/fotos/actualizar/{id}(id=${foto.id_foto})}" method="post" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label>Título de la Foto</label>
                    <input type="text" name="titulo_foto" th:value="${foto.titulo_foto}" required/>
                </div>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" name="id_usuario" th:value="${foto.id_usuario}" required/>
                </div>
                <div class="form-group">
                    <label>Fecha de Creación</label>
                    <input type="date" name="fecha_creacion"
                           th:value="${#temporals.format(foto.fecha_creacion, 'yyyy-MM-dd')}" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" th:text="${foto.descripcion}" required></textarea>
                </div>
                <div class="form-group">
                    <label>Nueva Imagen <span class="hint">(dejar vacío para conservar la actual)</span></label>
                    <input type="file" name="archivo" accept="image/*"/>
                    <!-- Vista previa de imagen actual -->
                    <img th:if="${foto.foto != null}" class="preview-actual"
                         th:src="@{/fotos/imagen/{id}(id=${foto.id_foto})}" alt="imagen actual"/>
                </div>
            </div>
            <div class="form-actions">
                <a class="btn-cancel" href="/fotos">Cancelar</a>
                <button type="submit" class="btn-save">Actualizar</button>
            </div>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="search-bar">
        <span class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span>
        <input type="text" id="buscador" placeholder="Buscar foto..." oninput="filtrarTabla()"/>
        <button class="btn-clear" id="btnLimpiar" onclick="limpiarBusqueda()" style="display:none" title="Limpiar">&#x2715;</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <table id="tablaFotos">
            <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Descripción</th>
                <th>Imagen</th>
                <th>Fecha Creación</th>
                <th>ID Usuario</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(fotos)}">
                <td colspan="7" class="empty-row">No hay fotos registradas.</td>
            </tr>
            <tr th:each="f : ${fotos}">
                <td th:text="${f.id_foto}"></td>
                <td th:text="${f.titulo_foto}"></td>
                <td th:text="${f.descripcion}"></td>
                <td>
                    <img th:if="${f.foto != null}" class="thumb"
                         th:src="@{/fotos/imagen/{id}(id=${f.id_foto})}" alt="foto"/>
                    <span th:unless="${f.foto != null}" class="no-img">Sin imagen</span>
                </td>
                <td th:text="${#temporals.format(f.fecha_creacion, 'dd/MM/yyyy')}"></td>
                <td th:text="${f.id_usuario}"></td>
                <td>
                    <a class="btn-edit" th:href="@{/fotos/editar/{id}(id=${f.id_foto})}" title="Editar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </a>
                    <a class="btn-delete" th:href="@{/fotos/eliminar/{id}(id=${f.id_foto})}"
                       onclick="return confirm('¿Eliminar esta foto?')" title="Eliminar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14H6L5 6h14z"/>
                            <path d="M10 11v6M14 11v6"/>
                            <path d="M9 6V4h6v2"/>
                        </svg>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
        <p id="sinResultados" class="empty-row" style="display:none; padding:22px; text-align:center; color:#999;">
            No se encontraron coincidencias.
        </p>
    </div>
</div>

<script>
    function filtrarTabla() {
        const valor = document.getElementById('buscador').value.toLowerCase();
        const filas = document.querySelectorAll('#tablaFotos tbody tr');
        const btnLimpiar = document.getElementById('btnLimpiar');
        let visibles = 0;

        btnLimpiar.style.display = valor ? 'inline-flex' : 'none';

        filas.forEach(fila => {
            if (fila.querySelector('.empty-row') || fila.querySelector('td[colspan]')) {
                fila.style.display = 'none';
                return;
            }
            const texto = fila.textContent.toLowerCase();
            const coincide = texto.includes(valor);
            fila.style.display = coincide ? '' : 'none';
            if (coincide) visibles++;
        });

        document.getElementById('sinResultados').style.display = (visibles === 0 && valor) ? 'block' : 'none';
    }

    function limpiarBusqueda() {
        document.getElementById('buscador').value = '';
        filtrarTabla();
        document.getElementById('buscador').focus();
    }
</script>

</body>
</html>
