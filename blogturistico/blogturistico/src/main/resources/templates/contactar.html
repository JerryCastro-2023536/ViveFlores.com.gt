<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Gestión de Contactos</title>
    <link rel="stylesheet" href="/css/estilos.css"   th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/contactar.css" th:href="@{/css/contactar.css}"/>
</head>
<body>

<!-- NAVBAR -->
<nav>
    <span class="brand">Vive Flores</span>
    <a class="btn-back" href="/">&#8592; Volver al inicio</a>
</nav>

<div class="container">
    <h1>Gestión de Contactos</h1>

    <!-- FORM CARD -->
    <div class="card">
        <!-- SAVE FORM -->
        <form th:if="${!modoEdicion}" th:action="@{/contactar/guardar}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Asunto</label>
                    <input type="text" name="asunto" th:value="${contactar.asunto}" placeholder="Asunto" required/>
                </div>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" name="id_usuario" th:value="${contactar.id_usuario}" placeholder="ID Usuario" required/>
                </div>
                <div class="form-group">
                    <label>ID Publicación</label>
                    <input type="number" name="id_publicacion" th:value="${contactar.id_publicacion}" placeholder="ID Publicación" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Fecha de Envío</label>
                    <input type="datetime-local" name="fecha_envio" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Mensaje</label>
                    <textarea name="mensaje" placeholder="Escribe el mensaje aquí..." required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>

        <!-- EDIT FORM -->
        <form th:if="${modoEdicion}" th:action="@{/contactar/actualizar/{id}(id=${contactar.id_contactar})}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Asunto</label>
                    <input type="text" name="asunto" th:value="${contactar.asunto}" placeholder="Asunto" required/>
                </div>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" name="id_usuario" th:value="${contactar.id_usuario}" placeholder="ID Usuario" required/>
                </div>
                <div class="form-group">
                    <label>ID Publicación</label>
                    <input type="number" name="id_publicacion" th:value="${contactar.id_publicacion}" placeholder="ID Publicación" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Fecha de Envío</label>
                    <input type="datetime-local" name="fecha_envio"
                           th:value="${#temporals.format(contactar.fecha_envio, 'yyyy-MM-dd''T''HH:mm')}" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Mensaje</label>
                    <textarea name="mensaje" th:text="${contactar.mensaje}" required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <a class="btn-cancel" href="/contactar">Cancelar</a>
                <button type="submit" class="btn-save">Actualizar</button>
            </div>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="search-bar">
        <span class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </span>
        <input type="text" id="buscador" placeholder="Buscar contacto..." oninput="filtrarTabla()"/>
        <button class="btn-clear" id="btnLimpiar" onclick="limpiarBusqueda()" style="display:none" title="Limpiar">&#x2715;</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <table id="tablaContactos">
            <thead>
            <tr>
                <th>ID</th>
                <th>Asunto</th>
                <th>Mensaje</th>
                <th>Fecha Envío</th>
                <th>ID Usuario</th>
                <th>ID Publicación</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(contactos)}">
                <td colspan="7" class="empty-row">No hay contactos registrados.</td>
            </tr>
            <tr th:each="c : ${contactos}">
                <td th:text="${c.id_contactar}"></td>
                <td th:text="${c.asunto}"></td>
                <td th:text="${c.mensaje}"></td>
                <td th:text="${#temporals.format(c.fecha_envio, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${c.id_usuario}"></td>
                <td th:text="${c.id_publicacion}"></td>
                <td>
                    <a class="btn-edit" th:href="@{/contactar/editar/{id}(id=${c.id_contactar})}" title="Editar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </a>
                    <a class="btn-delete" th:href="@{/contactar/eliminar/{id}(id=${c.id_contactar})}"
                       onclick="return confirm('¿Eliminar este contacto?')" title="Eliminar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6l-1 14H6L5 6h14z"/>
                            <path d="M10 11v6M14 11v6"/>
                            <path d="M9 6V4h6v2"/>
                        </svg>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
        <p id="sinResultados" class="empty-row" style="display:none; padding:22px; text-align:center; color:#999;">
            No se encontraron coincidencias.
        </p>
    </div>
</div>

<script>
    function filtrarTabla() {
        const valor = document.getElementById('buscador').value.toLowerCase();
        const filas = document.querySelectorAll('#tablaContactos tbody tr');
        const btnLimpiar = document.getElementById('btnLimpiar');
        let visibles = 0;

        btnLimpiar.style.display = valor ? 'inline-flex' : 'none';

        filas.forEach(fila => {
            if (fila.querySelector('.empty-row') || fila.querySelector('td[colspan]')) {
                fila.style.display = 'none';
                return;
            }
            const texto = fila.textContent.toLowerCase();
            const coincide = texto.includes(valor);
            fila.style.display = coincide ? '' : 'none';
            if (coincide) visibles++;
        });

        document.getElementById('sinResultados').style.display = (visibles === 0 && valor) ? 'block' : 'none';
    }

    function limpiarBusqueda() {
        document.getElementById('buscador').value = '';
        filtrarTabla();
        document.getElementById('buscador').focus();
    }
</script>

</body>
</html>
