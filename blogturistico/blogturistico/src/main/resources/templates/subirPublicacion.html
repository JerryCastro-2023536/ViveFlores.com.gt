<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Crear Publicación</title>
    <link rel="stylesheet" href="/css/estilos.css"           th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/subirPublicacion.css"  th:href="@{/css/subirPublicacion.css}"/>
</head>
<body>

<!-- ── NAV ────────────────────────────────────────────────── -->
<nav>
    <span class="brand">Vive Flores</span>
    <a class="btn-back" href="/" th:href="@{/}">&#8592; Volver al inicio</a>
</nav>

<div class="container">
    <h1>Crear Nueva Publicación</h1>

    <!-- ── FORM CARD ──────────────────────────────────────── -->
    <div class="card">
        <form th:action="@{/publicaciones/guardar}" method="post" enctype="multipart/form-data">

            <!-- Fila 1 -->
            <div class="form-row">
                <div class="form-group col-2">
                    <label>Nombre de la Publicación</label>
                    <input type="text" name="nombre_publicacion"
                           placeholder="Ej: Arreglo Floral Premium" required/>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="number" name="telefono"
                           placeholder="Ej: 50212345678" required/>
                </div>
                <div class="form-group">
                    <label>Horario de Atención</label>
                    <input type="text" name="horario"
                           placeholder="Lun–Vie 8:00–18:00" required/>
                </div>
            </div>

            <!-- Fila 2 -->
            <div class="form-row">
                <div class="form-group col-2">
                    <label>Descripción</label>
                    <textarea name="descripcion" rows="4"
                              placeholder="Describe tu negocio o servicio..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" name="direccion"
                           placeholder="Calle, zona, ciudad" required/>
                </div>
                <div class="form-group">
                    <label>Email de Contacto</label>
                    <input type="email" name="email_publicacion"
                           placeholder="correo@ejemplo.com" required/>
                </div>
            </div>

            <!-- Fila 3 -->
            <div class="form-row">
                <div class="form-group col-2">
                    <label>Archivo de Imagen</label>
                    <input type="file" name="foto" accept="image/*"
                           onchange="previewImage(event)"/>
                    <img id="foto-preview" class="foto-preview"
                         src="" alt="Vista previa"/>
                </div>
                <div class="form-group">
                    <label>Fecha de Creación</label>
                    <input type="date" name="fecha_creacion" disabled/>
                </div>
                <div class="form-group">
                    <label>Estado de Publicación</label>
                    <input type="text" name="estado_publicacion" disabled
                           placeholder="Pendiente / Activo / Inactivo"/>
                </div>
            </div>

            <!-- Fila 4 -->
            <div class="form-row">
                <div class="form-group col-2 invisible"></div>
                <div class="form-group">
                    <label>ID Categoría</label>
                    <input type="number" name="id_categoria" disabled
                           placeholder="ID de categoría"/>
                </div>
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" name="id_usuario" disabled
                           placeholder="ID de usuario"/>
                </div>
            </div>

            <!-- Acciones -->
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
            </div>

        </form>
    </div>
</div>

<script>
    function previewImage(event) {
        const preview = document.getElementById('foto-preview');
        const file    = event.target.files[0];
        if (file) {
            preview.src           = URL.createObjectURL(file);
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
    }
</script>

</body>
</html>
