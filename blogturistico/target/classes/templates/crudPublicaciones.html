<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="crud.css">
</head>

<body>

    <header>
        <h1>Vive Flores</h1>
        <a href="#" class="btn-volver">← Volver al inicio</a>
    </header>

    <main>
        <h2>Gestión de Publicaciones</h2>

        <div class="card">
            <form th:action="@{/savePublicacion}" method="post">
                <div class="grid-3">
                    <input type="text" placeholder="Nombre publicación" name="nombrePublicacion">
                    <input type="text" placeholder="Dirección" name="direccion">
                    <input type="number" placeholder="Teléfono" name="telefono">
                </div>
                <textarea placeholder="Descripción" name="descripcion"></textarea>
                <div class="grid-3">
                    <input type="email" placeholder="Email" name="emailPublicacion">
                    <input type="text" placeholder="Horario" name="horario">
                    <input type="date" name="fechaCreacion">
                </div>
                <div class="grid-3">
                    <input type="text" placeholder="Estado" name="estadoPublicacion">
                    <input type="number" placeholder="ID Categoría" name="idCategoria">
                    <input type="number" placeholder="ID Usuario" name="idUsuario">
                </div>

                <button type="submit">Guardar</button>
            </form>
            <form th:action="@{/searchPublicacion}" method="post">
                <input type="number" id="id" name="id" placeholder="Buscar por código" required>
                <button type="submit" class="btn-search" id="btn-buscar">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Descripcion</th>
                    <th>Telefono</th>
                    <th>Email</th>
                    <th>Horario</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>ID Categoría</th>
                    <th>ID Usuario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${publicaciones}">
                    <td th:text="${p.id_publicacion}"></td>
                    <td th:text="${p.nombre_publicacion}"></td>
                    <td th:text="${p.direccion}"></td>
                    <td th:text="${p.descripcion}"></td>
                    <td th:text="${p.telefono}"></td>
                    <td th:text="${p.email_publicacion}"></td>
                    <td th:text="${p.horario}"></td>
                    <td th:text="${p.fecha_creacion}"></td>
                    <td th:text="${p.estado_publicacion}"></td>
                    <td th:text="${p.id_categoria}"></td>
                    <td th:text="${p.id_usuario}"></td>
                    <td>
                        <button>Editar</button>
                        <a th:href="@{'/deletePublicacion/' + ${p.id_publicacion}}">
                            <button><i class="bi bi-trash"></i></button>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </main>

</body>

</html>
