<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="crud.css">
    <style>
        /* Estilos para el modal */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(10, 30, 43, 0.7); 
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: #faf7f0;
            margin: 5% auto; 
            padding: 30px;
            border: none;
            width: 80%;
            max-width: 800px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(10, 30, 43, 0.25);
            border-top: 4px solid #f6b93b;
            animation: modalFadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes modalFadeUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .close {
            color: #6b7c93;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .close:hover,
        .close:focus {
            color: #0a1e2b;
            text-decoration: none;
        }
        .file-input-container {
            margin-top: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
    </style>
</head>

<body>
<div th:replace="~{fragments :: errorGlobalNotification}"></div>

    <header>
        <h1>Vive Flores</h1>
        <a href="#" class="btn-volver">← Volver al inicio</a>
    </header>

    <main>
        <h2>Gestión de Publicaciones</h2>

        <div th:if="${error}" style="background-color: #f8d7da; color: #721c24; padding: 15px; margin-bottom: 20px; border: 1px solid #f5c6cb; border-radius: 4px; text-align: center;">
            <p th:text="${error}" style="margin: 0; font-weight: bold;"></p>
        </div>

        <div class="card">
            <form th:action="@{/savePublicacion}" method="post" enctype="multipart/form-data">
                <div class="grid-3">
                    <input type="text" placeholder="Nombre publicación" name="nombrePublicacion" required>
                    <input type="text" placeholder="Dirección" name="direccion" required>
                    <input type="number" placeholder="Teléfono" name="telefono" required>
                </div>
                <textarea placeholder="Descripción" name="descripcion" required></textarea>
                <div class="grid-3">
                    <input type="email" placeholder="Email" name="emailPublicacion" required>
                    <input type="text" placeholder="Horario" name="horario" required>
                    <input type="date" name="fechaCreacion" required>
                </div>
                <div class="grid-3">
                    <input type="text" placeholder="Estado" name="estadoPublicacion" required>
                    <input type="number" placeholder="ID Categoría" name="idCategoria" required>
                    <input type="number" placeholder="ID Usuario" name="idUsuario" required>
                </div>
                <div class="file-input-container">
                    <label><strong>Foto:</strong></label><br>
                    <input type="file" name="foto" required>
                </div>

                <button type="submit">Guardar</button>
            </form>
            <form th:action="@{/searchPublicacion}" method="post">
                <input type="number" id="id" name="id" placeholder="Buscar por código" required>
                <button type="submit" class="btn-search" id="btn-buscar">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>


        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Dirección</th>
                        <th>Descripcion</th>
                        <th>Telefono</th>
                        <th>Email</th>
                        <th>Horario</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>ID Categoría</th>
                        <th>ID Usuario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${publicaciones}">
                        <td th:text="${p.id_publicacion}"></td>
                        <td th:text="${p.nombre_publicacion}"></td>
                        <td th:text="${p.direccion}"></td>
                        <td th:text="${p.descripcion}"></td>
                        <td th:text="${p.telefono}"></td>
                        <td th:text="${p.email_publicacion}"></td>
                        <td th:text="${p.horario}"></td>
                        <td th:text="${p.fecha_creacion}"></td>
                        <td th:text="${p.estado_publicacion}"></td>
                        <td th:text="${p.id_categoria}"></td>
                        <td th:text="${p.id_usuario}"></td>
                        <td>
                            <button type="button" 
                                    th:data-id="${p.id_publicacion}"
                                    th:data-nombre="${p.nombre_publicacion}"
                                    th:data-direccion="${p.direccion}"
                                    th:data-descripcion="${p.descripcion}"
                                    th:data-telefono="${p.telefono}"
                                    th:data-email="${p.email_publicacion}"
                                    th:data-horario="${p.horario}"
                                    th:data-fecha="${p.fecha_creacion}"
                                    th:data-estado="${p.estado_publicacion}"
                                    th:data-categoria="${p.id_categoria}"
                                    th:data-usuario="${p.id_usuario}"
                                    onclick="openEditModal(this)">Editar</button>
                            <button type="button" 
                                    th:data-url="@{'/deletePublicacion/' + ${p.id_publicacion}}"
                                    onclick="openDeleteModal(this.getAttribute('data-url'))">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <!-- Modal de Edición -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Editar Publicación</h2>
            <form th:action="@{/updatePublicacion}" method="post" enctype="multipart/form-data">
                <input type="hidden" id="edit-id" name="id">
                
                <div class="grid-3">
                    <input type="text" placeholder="Nombre publicación" id="edit-nombre" name="nombrePublicacion">
                    <input type="text" placeholder="Dirección" id="edit-direccion" name="direccion">
                    <input type="number" placeholder="Teléfono" id="edit-telefono" name="telefono">
                </div>
                <textarea placeholder="Descripción" id="edit-descripcion" name="descripcion"></textarea>
                <div class="grid-3">
                    <input type="email" placeholder="Email" id="edit-email" name="emailPublicacion">
                    <input type="text" placeholder="Horario" id="edit-horario" name="horario">
                    <input type="date" id="edit-fecha" name="fechaCreacion">
                </div>
                <div class="grid-3">
                    <input type="text" placeholder="Estado" id="edit-estado" name="estadoPublicacion">
                    <input type="number" placeholder="ID Categoría" id="edit-categoria" name="idCategoria">
                    <input type="number" placeholder="ID Usuario" id="edit-usuario" name="idUsuario">
                </div>
                <div class="file-input-container">
                    <label><strong>Actualizar Foto:</strong></label><br>
                    <input type="file" name="foto" accept="image/*" enctype="multipart/form-data" >
                </div>

                <button type="submit" style="margin-top: 15px;">Actualizar Publicación</button>
            </form>
        </div>
    </div>

    <!-- Modal de Eliminación -->
    <div id="deleteModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <span class="close" onclick="closeDeleteModal()">&times;</span>
            <h2 style="color: #0a1e2b; margin-bottom: 15px;">¿Eliminar registro?</h2>
            <p style="color: #6b7c93; margin-bottom: 25px;">Esta acción no se puede deshacer.</p>
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button type="button" onclick="closeDeleteModal()" style="background: #e0e6ed; color: #1a1a2e; box-shadow: none;">Cancelar</button>
                <a id="confirmDeleteBtn" href="#">
                    <button type="button" style="background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3);">Sí, eliminar</button>
                </a>
            </div>
        </div>
    </div>

    <script>
        function openEditModal(btn) {
            document.getElementById('edit-id').value = btn.getAttribute('data-id');
            document.getElementById('edit-nombre').value = btn.getAttribute('data-nombre');
            document.getElementById('edit-direccion').value = btn.getAttribute('data-direccion');
            document.getElementById('edit-descripcion').value = btn.getAttribute('data-descripcion');
            document.getElementById('edit-telefono').value = btn.getAttribute('data-telefono');
            document.getElementById('edit-email').value = btn.getAttribute('data-email');
            document.getElementById('edit-horario').value = btn.getAttribute('data-horario');
            document.getElementById('edit-fecha').value = btn.getAttribute('data-fecha');
            document.getElementById('edit-estado').value = btn.getAttribute('data-estado');
            document.getElementById('edit-categoria').value = btn.getAttribute('data-categoria');
            document.getElementById('edit-usuario').value = btn.getAttribute('data-usuario');
            
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function openDeleteModal(url) {
            document.getElementById('confirmDeleteBtn').href = url;
            document.getElementById('deleteModal').style.display = 'block';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        // Cerrar modal al hacer clic fuera del contenido
        window.onclick = function(event) {
            var editModal = document.getElementById('editModal');
            var deleteModal = document.getElementById('deleteModal');
            if (event.target == editModal) {
                closeEditModal();
            }
            if (event.target == deleteModal) {
                closeDeleteModal();
            }
        }
    </script>
</body>

</html>
