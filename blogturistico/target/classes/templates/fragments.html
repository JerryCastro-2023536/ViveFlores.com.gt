<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel='stylesheet' type='text/css' media='screen' href='index.css'>
</head>
<body>
    <header th:fragment="header">
        <div class="logo">Vive Flores</div>
            <nav>
                <ul>
                    <li><a th:href="@{/index}">Inicio</a></li>
                    <li><a href="#">Categorias</a></li>
                    <li><a th:href="@{/publicacionesAll}">Publicaciones</a></li>
                    <li><a th:href="@{/eventosAll}">Eventos</a></li>
                    <li><a th:href="@{/serviciosAll}">Servicios</a></li>
                    <li><a th:href="@{/quienessomos}">¿Quienes Somos?</a></li>
                    <li><a th:href="@{/contacto}">Contacto</a></li>
                    <li><a th:if="${session.usuarioLogueado != null}" th:href="@{/perfil}">Perfil</a></li>
                    <li th:if="${session.usuarioLogueado != null and #strings.equalsIgnoreCase(session.usuarioLogueado.rol, 'usuario')}">
                        <a th:href="@{/vendedor}">Conviertete en vendedor</a>
                    </li>
                    <li th:if="${session.usuarioLogueado != null and #strings.equalsIgnoreCase(session.usuarioLogueado.rol, 'vendedor')}">
                        <a th:href="@{/panelvendedor}">administrar</a>
                    </li>
                    <li th:if="${session.usuarioLogueado != null and #strings.equalsIgnoreCase(session.usuarioLogueado.rol, 'admin')}">
                        <a href="paneladmin">Administrar</a>
                    </li>
                </ul>
            </nav>
            <div class="user-actions" style="display: flex; align-items: center; gap: 15px;">
                <a th:if="${session.usuarioLogueado == null}" href="acceder"><button class="btn-login">Iniciar Sesión</button></a>
                <a th:if="${session.usuarioLogueado != null}" href="logout"><button class="btn-login" style="background-color: #e74c3c;">Cerrar Sesión</button></a>
            </div>
        </div>
    </header>
</body>
</html>
