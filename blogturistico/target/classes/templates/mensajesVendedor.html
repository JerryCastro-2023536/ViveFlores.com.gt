<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/mensajesVendedor.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Bandeja de Entrada</title>
</head>
<body>
<header>
    <div class="logo">Vive Flores</div>
    <nav>
        <button id="btn-regresar" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i> volver al inicio
        </button>
    </nav>
</header>

<main class="mensajes-container">
    <div class="header-section">
        <h2><i class="bi bi-chat-dots-fill"></i> Mensajes de Clientes</h2>
        <p>Gestiona las consultas sobre tus publicaciones</p>
    </div>

    <div class="tabla-mensajes">
        <div class="grid-header">
            <span>Cliente</span>
            <span>Asunto / Publicación</span>
            <span>Mensaje</span>
            <span>Fecha</span>
            <span>Acción</span>
        </div>

        <div class="grid-row" th:each="contacto : ${listaContactos}">
            <div class="cliente-info">
                <i class="bi bi-person-circle"></i>
                <span>Nombre Cliente</span>
            </div>

            <div class="asunto-info">
                <strong>Asunto</strong>
                <small >Nombre de la Publicación</small>
            </div>

            <div class="mensaje-preview">
                <p>Contenido del mensaje...</p>
            </div>

            <div class="fecha-info">
                <span>01/01/2026</span>
            </div>

            <div class="acciones">
                <a class="btn-responder" title="Responder">
                    <i class="bi bi-reply-fill"></i>
                </a>
                <form style="display:inline;">
                    <button type="submit" class="btn-eliminar" onclick="return confirm('¿Eliminar este mensaje?')">
                        <i class="bi bi-trash3-fill"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="no-mensajes">
            <i class="bi bi-inbox"></i>
            <p>No tienes mensajes nuevos en este momento.</p>
        </div>
    </div>
</main>
</body>
</html>
