<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CRUD Reseñas</title>

    <link rel="stylesheet" th:href="@{/EventosCrud.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments :: errorGlobalNotification}"></div>

<div th:replace="~{fragments :: headerAdmin}"></div>

<div class="container">

    <h2 class="titulo">Gestión de Reseñas</h2>

    <!-- FORMULARIO -->
    <div class="form-container">

        <form th:action="@{/resenascrud/guardar}"
              th:object="${resena}"
              method="post">

            <input type="hidden" th:field="*{id_resena}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Título</label>

                    <input type="text"
                           th:field="*{titulo_resena}"
                           required>
                </div>

                <div class="form-group full">
                    <label>Comentario</label>

                    <textarea th:field="*{comentario}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="form-group">
                    <label>Calificación</label>

                    <input type="number"
                           min="1"
                           max="5"
                           th:field="*{calificacion}"
                           required>
                </div>

                <div class="form-group">
                    <label>Fecha de Creación</label>

                    <input type="date"
                           th:field="*{fecha_creacion}"
                           required>
                </div>

                <div class="form-group">
                    <label>ID Usuario</label>

                    <input type="number"
                           th:field="*{id_usuario}"
                           required>
                </div>

                <div class="form-group">
                    <label>ID Publicación</label>

                    <input type="number"
                           th:field="*{id_publicacion}"
                           required>
                </div>

            </div>

            <button type="submit">
                Guardar
            </button>

        </form>

    </div>

    <!-- BUSCADOR -->
    <div class="mb-4 d-flex justify-content-center gap-2">

        <input type="number"
               id="buscarId"
               placeholder="Buscar por ID"
               class="form-control"
               style="max-width: 300px;">

        <button onclick="buscarResena()"
                class="btn btn-dark">

            <i class="bi bi-search"></i>
        </button>

    </div>

    <!-- TABLA -->
    <div class="tabla-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Comentario</th>
                <th>Calificación</th>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Publicación</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="r : ${resenas}">

                <td th:text="${r.id_resena}"></td>
                <td th:text="${r.titulo_resena}"></td>
                <td th:text="${r.comentario}"></td>
                <td th:text="${r.calificacion}"></td>
                <td th:text="${r.fecha_creacion}"></td>
                <td th:text="${r.id_usuario}"></td>
                <td th:text="${r.id_publicacion}"></td>

                <td class="acciones">

                    <!-- EDITAR -->
                    <button type="button"

                            th:attr="
                                data-id=${r.id_resena},
                                data-titulo=${r.titulo_resena},
                                data-comentario=${r.comentario},
                                data-calificacion=${r.calificacion},
                                data-fecha=${r.fecha_creacion},
                                data-usuario=${r.id_usuario},
                                data-publicacion=${r.id_publicacion}"

                            onclick="openEditResenaModal(this)"

                            class="btn btn-warning">

                        <i class="bi bi-pencil-square"></i>
                    </button>

                    <!-- ELIMINAR -->
                    <button type="button"

                            th:data-url="@{'/resenascrud/eliminar/' + ${r.id_resena}}"

                            onclick="openDeleteModal(this.getAttribute('data-url'))"

                            class="btn btn-danger">

                        <i class="bi bi-trash"></i>
                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- BUSCADOR JS -->
<script>

    function buscarResena() {

        let input = document.getElementById("buscarId").value;

        let filas = document.querySelectorAll("tbody tr");

        filas.forEach(fila => {

            let id = fila.children[0].textContent;

            if (id === input || input === "") {

                fila.style.display = "";

            } else {

                fila.style.display = "none";
            }
        });
    }

</script>

<!-- MODAL ELIMINAR -->
<div id="deleteModal" class="modal">

    <div class="modal-content"
         style="max-width: 400px; text-align: center;">

        <span class="close"
              onclick="closeDeleteModal()">

            &times;
        </span>

        <h2>¿Eliminar reseña?</h2>

        <p>
            Esta acción no se puede deshacer.
        </p>

        <div style="
            display:flex;
            justify-content:center;
            gap:15px;">

            <button type="button"
                    class="btn-cancel"
                    onclick="closeDeleteModal()">

                Cancelar
            </button>

            <a id="confirmDeleteBtn" href="#">

                <button type="button"
                        class="btn btn-danger"

                        onclick="
                        window.location.href=
                        document.getElementById('confirmDeleteBtn')
                        .getAttribute('data-url')">

                    Sí, eliminar
                </button>

            </a>

        </div>

    </div>

</div>

<!-- MODAL EDITAR -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <span class="close"
              onclick="closeEditModal()">

            &times;
        </span>

        <h2>Editar Reseña</h2>

        <form th:action="@{/resenascrud/guardar}"
              method="post">

            <input type="hidden"
                   id="edit-id"
                   name="id_resena">

            <div class="mb-3">

                <label class="form-label">
                    Título
                </label>

                <input type="text"
                       id="edit-titulo"
                       name="titulo_resena"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Comentario
                </label>

                <textarea id="edit-comentario"
                          name="comentario"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Calificación
                </label>

                <input type="number"
                       min="1"
                       max="5"
                       id="edit-calificacion"
                       name="calificacion"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Fecha de Creación
                </label>

                <input type="date"
                       id="edit-fecha"
                       name="fecha_creacion"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    ID Usuario
                </label>

                <input type="number"
                       id="edit-usuario"
                       name="id_usuario"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    ID Publicación
                </label>

                <input type="number"
                       id="edit-publicacion"
                       name="id_publicacion"
                       class="form-control">

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Actualizar Reseña
            </button>

        </form>

    </div>

</div>

<!-- JS MODAL EDITAR -->
<script>

    function openEditResenaModal(button) {

        document.getElementById("edit-id").value =
            button.getAttribute("data-id");

        document.getElementById("edit-titulo").value =
            button.getAttribute("data-titulo");

        document.getElementById("edit-comentario").value =
            button.getAttribute("data-comentario");

        document.getElementById("edit-calificacion").value =
            button.getAttribute("data-calificacion");

        document.getElementById("edit-fecha").value =
            button.getAttribute("data-fecha");

        document.getElementById("edit-usuario").value =
            button.getAttribute("data-usuario");

        document.getElementById("edit-publicacion").value =
            button.getAttribute("data-publicacion");

        document.getElementById("editModal").style.display = "block";
    }

</script>

<script th:src="@{/Modal.js}"></script>

</body>
</html>
