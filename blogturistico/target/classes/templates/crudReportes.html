<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="crud.css">
</head>

<body>
    <header>
        <h1>Vive Flores</h1>
        <a href="paneladmin" class="btn-volver">Volver al inicio</a>
    </header>

    <main>
        <h2>Gestión de Reportes</h2>
        <div class="card">
            <form th:action="@{/saveReporte}" method="post">
                <input type="text" placeholder="Asunto" name="asunto">
                <textarea placeholder="Mensaje" name="mensaje"></textarea>
                <div class="grid-2">
                    <input type="datetime-local" name="fecha">
                    <input type="text" placeholder="ID Usuario" name="idUsuario">
                </div>
                <button type="submit">Guardar</button>
            </form>
            <form th:action="@{/searchReporte}" method="post">
                <input type="number" id="id" name="id" placeholder="Buscar por código" required>
                <button type="submit" class="btn-search" id="btn-buscar">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Asunto</th>
                    <th>Mensaje</th>
                    <th>Fecha</th>
                    <th>ID Usuario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reportes}">
                    <td th:text="${r.id_reporte}"></td>
                    <td th:text="${r.asunto}"></td>
                    <td th:text="${r.mensaje}"></td>
                    <td th:text="${r.fecha_envio}"></td>
                    <td th:text="${r.id_usuario}"></td>
                    <td>
                        <a th:href="@{'/deleteReporte/' + ${r.id_reporte}}">
                            <button>Editar</button>
                            <button>
                                <i class="bi bi-trash"></i>
                            </button>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

</body>

</html>
