<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Agregar Servicio - Vive Flores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" th:href="@{/usuarios.css}">
</head>
<body>
<div th:replace="~{fragments :: headerVendedor}"></div>

<main>
    <h2>Registrar Nuevo Servicio</h2>

    <div class="card">
        <div th:if="${param.exito}" style="background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 500; border: 1px solid #c3e6cb;">
            <i class="bi bi-check-circle-fill"></i> ¡Servicio publicado con éxito!
        </div>

        <form th:action="@{/servicio/agregar}" th:object="${servicio}" method="post">

            <div style="text-align: left; margin-bottom: 5px;">
                <label style="font-size: 13px; color: var(--text-light);">Nombre del servicio:</label>
            </div>
            <input type="text" th:field="*{nombre_servicio}" placeholder="Ej. Decoración de Eventos" required>

            <div style="text-align: left; margin-top: 15px; margin-bottom: 5px;">
                <label style="font-size: 13px; color: var(--text-light);">Descripción detallada:</label>
            </div>
            <textarea th:field="*{descripcion}" placeholder="Cuéntanos más sobre lo que ofreces..." rows="5" required></textarea>

            <div style="margin-top: 15px;">
                <div style="text-align: left;">
                    <label style="font-size: 13px; color: var(--text-light);">Teléfono de contacto:</label>
                    <input type="number" th:field="*{telefono}" placeholder="Ej. 12345678" required>
                </div>
            </div>

            <button type="submit" style="width: 100%; margin-top: 30px; font-size: 16px;">
                <i class="bi bi-plus-circle"></i> Publicar Servicio
            </button>
        </form>
    </div>
</main>
</body>
</html>
