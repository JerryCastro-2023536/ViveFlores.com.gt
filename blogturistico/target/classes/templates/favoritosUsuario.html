<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="favoritosUsuario.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Favoritos</title>
</head>
<body>
    <header>
        <div class="logo">Vive Flores</div>
            <nav>
                <ul>
                    <button id="btn-regresar"> <i class="bi bi-arrow-left"></i> volver al inicio</button>
            
                </ul>
            </nav>
        </div>
    </header>
    <h2>Tus Favoritos</h2>
    <div class="container">
        <div class="fav1" th:each="fav : ${publicaciones}">
            <div class="content">

                <img th:src="@{'/publicaciones/foto/' + ${fav.id_publicacion}}" width="200">

                <div class="textos-column">
                    <h3 th:text="${fav.nombre_publicacion}"></h3>
                    <p th:text="${fav.descripcion}"></p>

                    <a th:href="@{'/post/' + ${fav.id_publicacion}}">Ver</a>
                </div>

                <i class="bi bi-star-fill"></i>

            </div>
        </div>
    </div>
</body>
</html>
