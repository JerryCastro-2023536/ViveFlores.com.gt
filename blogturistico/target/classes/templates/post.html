<!DOCTYPE html>
<html lang='en' xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title th:text="${post.nombre_publicacion}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/post.css}">
    <link rel="stylesheet" th:href="@{/index.css}">
</head>

<body>

    <div th:replace="~{fragments :: headerNormal}"></div>

<main class="feed">

    <div class="post">

        <div class="post-header">
            <h2 th:text="${post.nombre_publicacion}"></h2>
            <form class="heart-container" title="Like" th:action="@{'/favorito/' + ${post.id_publicacion}}" method="post">
                <input type="checkbox"
                    class="checkbox"
                    id="Give-It-An-Id"
                    name="favorito"
                    th:checked="${esFavorito}"
                    onchange="this.form.submit()"/>

                <div class="svg-container">
                    <svg viewBox="0 0 24 24" class="svg-outline" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.5,1.917a6.4,6.4,0,0,0-5.5,3.3,6.4,6.4,0,0,0-5.5-3.3A6.8,6.8,0,0,0,0,8.967c0,4.547,4.786,9.513,8.8,12.88a4.974,4.974,0,0,0,6.4,0C19.214,18.48,24,13.514,24,8.967A6.8,6.8,0,0,0,17.5,1.917Zm-3.585,18.4a2.973,2.973,0,0,1-3.83,0C4.947,16.006,2,11.87,2,8.967a4.8,4.8,0,0,1,4.5-5.05A4.8,4.8,0,0,1,11,8.967a1,1,0,0,0,2,0,4.8,4.8,0,0,1,4.5-5.05A4.8,4.8,0,0,1,22,8.967C22,11.87,19.053,16.006,13.915,20.313Z">
                        </path>
                    </svg>
                    <svg viewBox="0 0 24 24" class="svg-filled" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.5,1.917a6.4,6.4,0,0,0-5.5,3.3,6.4,6.4,0,0,0-5.5-3.3A6.8,6.8,0,0,0,0,8.967c0,4.547,4.786,9.513,8.8,12.88a4.974,4.974,0,0,0,6.4,0C19.214,18.48,24,13.514,24,8.967A6.8,6.8,0,0,0,17.5,1.917Z">
                        </path>
                    </svg>
                    <svg class="svg-celebrate" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="10,10 20,20"></polygon>
                        <polygon points="10,50 20,50"></polygon>
                        <polygon points="20,80 30,70"></polygon>
                        <polygon points="90,10 80,20"></polygon>
                        <polygon points="90,50 80,50"></polygon>
                        <polygon points="80,80 70,70"></polygon>
                        </svg>
                </div>
            </form>
        </div>

        <img class="post-img" th:src="@{'/publicaciones/foto/' + ${post.id_publicacion}}">

        <div class="post-body">

            <p th:text="${post.descripcion}"></p>

            <div class="post-info">
                <span><i class="bi bi-geo"></i> <span th:text="${post.direccion}"></span></span>
                <span><i class="bi bi-telephone"></i> <span th:text="${post.telefono}"></span></span>
                <span><i class="bi bi-envelope"></i> <span th:text="${post.email_publicacion}"></span></span>
                <span><i class="bi bi-clock"></i> <span th:text="${post.horario}"></span></span>
                <span><i class="bi bi-calendar"></i> <span th:text="${post.fecha_creacion}"></span></span>
            </div>

        </div>

        <!-- CALIFICACIÓN -->
        <div class="rating">
        </div>

        <!-- COMENTARIOS -->
        <div class="comments">

            <h3>Comentarios</h3>

            <div th:each="resena : ${resenas}" class="comment" style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee;">
                <strong><i class="bi bi-person-circle" style="margin-right: 5px;"></i><span th:text="${nombresUsuarios.get(resena.id_usuario)}"></span></strong> 
                <span style="color: #f1c40f; margin-left: 10px;">
                    <i class="bi bi-star-fill" th:each="i : ${#numbers.sequence(1, resena.calificacion)}"></i>
                    <i class="bi bi-star" th:if="${resena.calificacion < 5}" th:each="i : ${#numbers.sequence(resena.calificacion + 1, 5)}"></i>
                </span>
                <span style="font-size: 0.8em; color: #999; margin-left: 10px;" th:text="${resena.fecha_creacion}"></span>
                <p style="margin-top: 5px;" th:text="${resena.comentario}"></p>
            </div>

            <div th:if="${#lists.isEmpty(resenas)}" class="comment">
                <p>Aún no hay comentarios. ¡Sé el primero en opinar!</p>
            </div>

            <!-- FORM -->
            <form th:if="${session.usuarioLogueado != null}" class="comment-form" th:action="@{'/post/' + ${post.id_publicacion} + '/comentar'}" method="post" style="margin-top: 20px;">
                <input type="hidden" name="tituloResena" value="Comentario">
                
                <div style="margin-bottom: 10px;">
                    <label for="calificacion" style="font-weight: bold; margin-right: 10px;">Calificación:</label>
                    <select name="calificacion" id="calificacion" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="5">5 Estrellas</option>
                        <option value="4">4 Estrellas</option>
                        <option value="3">3 Estrellas</option>
                        <option value="2">2 Estrellas</option>
                        <option value="1">1 Estrella</option>
                    </select>
                </div>

                <input type="text" name="comentario" placeholder="Escribe un comentario..." required style="width: calc(100% - 100px); padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                <button type="submit" style="padding: 10px 15px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">Publicar</button>
            </form>
            
            <!-- Mensaje si no está logueado -->
            <div th:if="${session.usuarioLogueado == null}" style="margin-top: 20px; padding: 15px; background-color: #f8d7da; color: #721c24; border-radius: 5px; border: 1px solid #f5c6cb;">
                <p style="margin: 0;">Debes <a th:href="@{/acceder}" style="color: #721c24; font-weight: bold; text-decoration: underline;">iniciar sesión</a> para poder calificar y comentar.</p>
            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
