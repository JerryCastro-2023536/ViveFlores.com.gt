<!DOCTYPE html>
<html lang='en' xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title th:text="${post.nombre_publicacion}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/post.css}">
    <link rel="stylesheet" th:href="@{/index.css}">
</head>

<body>

<header>
    <div class="logo">Vive Flores</div>
    <nav>
        <ul>
            <li><a th:href="@{/index}">Inicio</a></li>
            <li><a href="">Categorias</a></li>
            <li><a th:href="@{/publicaciones}">Publicaciones</a></li>
            <li><a th:href="@{/eventos}">Eventos</a></li>
            <li><a th:href="@{/servicios}">Servicios</a></li>
            <li><a th:href="@{/quienessomos}">¿Quienes Somos?</a></li>
            <li><a th:href="@{/contacto}">Contacto</a></li>
            <li><a th:href="@{/vendedor}">Conviertete en vendedor</a></li>
            <li><a th:href="@{/paneladmin}">Administrar</a></li>
        </ul>
    </nav>
    <a th:href="@{/acceder}"><button class="btn-login">Iniciar Sesión</button></a>
    </div>
</header>

<main class="feed">

    <div class="post">

        <div class="post-header">
            <h2 th:text="${post.nombre_publicacion}"></h2>
            <span class="estado" th:text="${post.estado_publicacion}"></span>
        </div>

        <img class="post-img" th:src="@{'/publicaciones/foto/' + ${post.id_publicacion}}">

        <div class="post-body">

            <p th:text="${post.descripcion}"></p>

            <div class="post-info">
                <span><i class="bi bi-geo"></i> <span th:text="${post.direccion}"></span></span>
                <span><i class="bi bi-telephone"></i> <span th:text="${post.telefono}"></span></span>
                <span><i class="bi bi-envelope"></i> <span th:text="${post.email_publicacion}"></span></span>
                <span><i class="bi bi-clock"></i> <span th:text="${post.horario}"></span></span>
                <span><i class="bi bi-calendar"></i> <span th:text="${post.fecha_creacion}"></span></span>
            </div>

        </div>

        <!-- CALIFICACIÓN -->
        <div class="rating">
        </div>

        <!-- COMENTARIOS -->
        <div class="comments">

            <h3>Comentarios</h3>

            <div th:each="resena : ${resenas}" class="comment" style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee;">
                <strong>Usuario <span th:text="${resena.id_usuario}"></span></strong> 
                <span style="color: #f1c40f; margin-left: 10px;">
                    <i class="bi bi-star-fill" th:each="i : ${#numbers.sequence(1, resena.calificacion)}"></i>
                    <i class="bi bi-star" th:if="${resena.calificacion < 5}" th:each="i : ${#numbers.sequence(resena.calificacion + 1, 5)}"></i>
                </span>
                <span style="font-size: 0.8em; color: #999; margin-left: 10px;" th:text="${resena.fecha_creacion}"></span>
                <p style="margin-top: 5px;" th:text="${resena.comentario}"></p>
            </div>

            <div th:if="${#lists.isEmpty(resenas)}" class="comment">
                <p>Aún no hay comentarios. ¡Sé el primero en opinar!</p>
            </div>

            <!-- FORM -->
            <form class="comment-form" th:action="@{'/post/' + ${post.id_publicacion} + '/comentar'}" method="post" style="margin-top: 20px;">
                <input type="hidden" name="tituloResena" value="Comentario">
                
                <div style="margin-bottom: 10px;">
                    <label for="calificacion" style="font-weight: bold; margin-right: 10px;">Calificación:</label>
                    <select name="calificacion" id="calificacion" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="5">5 Estrellas</option>
                        <option value="4">4 Estrellas</option>
                        <option value="3">3 Estrellas</option>
                        <option value="2">2 Estrellas</option>
                        <option value="1">1 Estrella</option>
                    </select>
                </div>

                <input type="text" name="comentario" placeholder="Escribe un comentario..." required style="width: calc(100% - 100px); padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                <button type="submit" style="padding: 10px 15px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">Publicar</button>
            </form>

        </div>

    </div>

</main>

<footer>
    <p>&copy; 2024 Vive Flores</p>
</footer>

</body>
</html>
