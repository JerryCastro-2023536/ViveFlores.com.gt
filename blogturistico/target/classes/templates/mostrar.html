<!DOCTYPE html>
<html lang='en' xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='mostrar.css'>
</head>
<body>
    
    <div th:replace="~{fragments :: header}"></div>

    <section class="hero">
        <h1>Elementos encontrados</h1>      
        <p>resultados encontrados para "<span th:text="${busqueda}"></span>"</p>
    </section>

    <!-- NEGOCIOS -->
    <section class="section">
        <h2>Negocios Destacados</h2>
        <div class="cards">
            <div class="card" th:each="p : ${publiEncont}">
                <img class="foto" th:src="@{'/publicaciones/foto/' + ${p.id_publicacion}}" alt="publicacion">
                <h3 th:text="${p.nombre_publicacion}">Nombre</h3>
                <p th:text="${p.descripcion}">Descripcion</p>
                <a th:href="@{'/post/' + ${p.id_publicacion}}">
                    <button>Ver más</button>
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Vive Flores — Isla de Flores, Petén, Guatemala</p>
    </footer>
</body>
</html>
