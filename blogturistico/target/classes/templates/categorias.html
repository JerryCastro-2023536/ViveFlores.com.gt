<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Gestión de Categorías</title>
    <link rel="stylesheet" href="/css/estilos.css"    th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/categorias.css" th:href="@{/css/categorias.css}"/>
</head>
<body>
<div th:replace="~{fragments :: errorGlobalNotification}"></div>

<div th:replace="~{fragments :: headerAdmin}"></div>

<div class="container">
    <h1>Gestión de Categorías</h1>

    <!-- FORM CARD — sólo para guardar nuevos registros -->
    <div class="card">
        <form th:action="@{/categorias/guardar}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre de Categoría</label>
                    <input type="text" name="nombre_categoria"
                           placeholder="Nombre de categoría" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" placeholder="Descripción de la categoría..." required></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
            </div>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="search-wrapper">
        <div class="search-bar">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="searchInput" placeholder="Buscar categoría..." oninput="filterTable()"/>
            <button class="btn-clear" id="btnClear" onclick="clearSearch()" style="display:none;" title="Limpiar">&#10005;</button>
        </div>
        <button class="btn-search" onclick="filterTable()" title="Buscar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>

    <!-- TABLE -->
    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre Categoría</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="4" class="empty-row">No hay categorías registradas.</td>
            </tr>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.id_categoria}"></td>
                <td th:text="${cat.nombre_categoria}"></td>
                <td th:text="${cat.descripcion}"></td>
                <td>
                    <button type="button"
                            class="btn-edit"
                            th:data-id="${cat.id_categoria}"
                            th:data-nombre="${cat.nombre_categoria}"
                            th:data-descripcion="${cat.descripcion}"
                            onclick="openEditModal(this)">Editar</button>

                    <button type="button"
                            class="btn-delete"
                            th:data-url="@{'/categorias/eliminar/' + ${cat.id_categoria}}"
                            onclick="openDeleteModal(this.getAttribute('data-url'))">Eliminar</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== Modal de Eliminación ===== -->
<div id="deleteModal" class="modal">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <span class="close" onclick="closeDeleteModal()">&times;</span>
        <h2 style="color: #0a1e2b; margin-bottom: 15px;">¿Eliminar categoría?</h2>
        <p style="color: #6b7c93; margin-bottom: 25px;">Esta acción no se puede deshacer.</p>
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button type="button" class="btn-modal-cancel" onclick="closeDeleteModal()">Cancelar</button>
            <a id="confirmDeleteBtn" href="#">
                <button type="button" class="btn-confirm-delete">Sí, eliminar</button>
            </a>
        </div>
    </div>
</div>

<!-- ===== Modal de Edición ===== -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h2>Editar Categoría</h2>
        <form id="editForm" method="post">
            <input type="hidden" id="edit-id" name="id"/>

            <div class="form-row">
                <div class="form-group">
                    <label>Nombre de Categoría</label>
                    <input type="text" id="edit-nombre" name="nombre_categoria"
                           placeholder="Nombre de categoría" required/>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="edit-descripcion" name="descripcion"
                              placeholder="Descripción de la categoría..." required></textarea>
                </div>
            </div>

            <button type="submit" style="margin-top: 15px;">Actualizar Categoría</button>
        </form>
    </div>
</div>

<script>
    function filterTable() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.getElementById('btnClear').style.display = q ? 'inline-flex' : 'none';
        const rows = document.querySelectorAll('#mainTable tbody tr:not(.empty-row-js)');
        let visible = 0;
        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            const show = text.includes(q);
            row.style.display = show ? '' : 'none';
            if (show) visible++;
        });
        let noResult = document.getElementById('noResultRow');
        if (!visible) {
            if (!noResult) {
                noResult = document.createElement('tr');
                noResult.id = 'noResultRow';
                noResult.classList.add('empty-row-js');
                noResult.innerHTML = '<td colspan="4" class="empty-row">No se encontraron resultados.</td>';
                document.querySelector('#mainTable tbody').appendChild(noResult);
            }
            noResult.style.display = '';
        } else if (noResult) {
            noResult.style.display = 'none';
        }
    }
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        filterTable();
    }
    function openEditModal(btn) {
        const id = btn.getAttribute('data-id');
        document.getElementById('edit-id').value          = id;
        document.getElementById('edit-nombre').value      = btn.getAttribute('data-nombre');
        document.getElementById('edit-descripcion').value = btn.getAttribute('data-descripcion');
        document.getElementById('editForm').action        = '/categorias/actualizar/' + id;
        document.getElementById('editModal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function openDeleteModal(url) {
        document.getElementById('confirmDeleteBtn').href = url;
        document.getElementById('deleteModal').style.display = 'block';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const editModal   = document.getElementById('editModal');
        const deleteModal = document.getElementById('deleteModal');
        if (event.target === editModal)   closeEditModal();
        if (event.target === deleteModal) closeDeleteModal();
    };
</script>

</body>
</html>
