<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" type="text/css" href="Cards.css">
    <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>

    <div th:replace="~{fragments :: headerNormal}"></div>

    <section class="hero-small">
        <h1>Eventos</h1>
        <p>Vive las festividades y celebraciones únicas de la Isla de Flores, Petén</p>
    </section>

    <section class="eventos-container">
        <div class="evento-card"  th:each="e : ${eventos}">
            <div class="evento-image">
                <img th:src="@{'/eventos/foto/' + ${e.id_evento}}" alt="Imagen evento">
            </div>
            <div class="evento-body">
                <h3 th:text="${e.nombre_evento}"></h3>
                <p th:text="${e.descripcion}"></p>
                <div class="evento-detalles">
                    <div class="detalle">
                        <span class="label">Fechas:</span>
                        <div>
                            <strong>Inicio:</strong><p th:text="${e.fecha_inicio}"></p>
                            <strong>Fin:</strong><p th:text="${e.fecha_fin}"></p>
                        </div>
                    </div>
                    <div class="detalle">
                        <span class="label">Ubicación:</span>
                        <span th:text="${e.ubicacion}"></span>
                    </div>
                </div>
                <a th:href="@{'/evento/' + ${e.id_evento}}" style="display: block; width: 100%; text-align: center; margin-top: 15px; padding: 10px; background-color: #2c3e50; color: white; text-decoration: none; border-radius: 4px;">Ver más</a>
            </div>
        </div>
    </section>

    <div th:replace="~{fragments :: footer}"></div>

</body>
</html>
