<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CRUD Servicios</title>

    <link rel="stylesheet" th:href="@{/EventosCrud.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<header>
    <div class="logo">Vive Flores</div>

    <nav>
        <a th:href="@{/}" class="btn-home">
            ⬅ Volver al inicio
        </a>
    </nav>
</header>

<div class="container">

    <h2 class="titulo">Gestión de Servicios</h2>

    <!-- FORMULARIO -->
    <div class="form-container">

        <form th:action="@{/servicioscrud/guardar}"
              th:object="${servicio}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id_servicio}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre</label>

                    <input type="text"
                           th:field="*{nombre_servicio}"
                           required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>

                    <input type="number"
                           th:field="*{telefono}"
                           required>
                </div>

                <div class="form-group full">
                    <label>Descripción</label>

                    <textarea th:field="*{descripcion}"
                              rows="3"
                              required></textarea>
                </div>

                <div class="form-group">
                    <label>Foto</label>

                    <input type="file" name="archivo">
                </div>

                <div class="form-group">
                    <label>Fecha de Creación</label>

                    <input type="date"
                           th:field="*{fecha_creacion}"
                           required>
                </div>

                <div class="form-group">
                    <label>ID Usuario</label>

                    <input type="number"
                           th:field="*{id_usuario}"
                           required>
                </div>

            </div>

            <button type="submit">
                Guardar
            </button>

        </form>

    </div>

    <!-- BUSCADOR -->
    <div class="mb-4 d-flex justify-content-center gap-2">

        <input type="number"
               id="buscarId"
               placeholder="Buscar por ID"
               class="form-control"
               style="max-width: 300px;">

        <button onclick="buscarServicio()"
                class="btn btn-dark">

            <i class="bi bi-search"></i>
        </button>

    </div>

    <!-- TABLA -->
    <div class="tabla-container">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="s : ${servicios}">

                <td th:text="${s.id_servicio}"></td>
                <td th:text="${s.nombre_servicio}"></td>
                <td th:text="${s.telefono}"></td>
                <td th:text="${s.descripcion}"></td>
                <td th:text="${s.fecha_creacion}"></td>
                <td th:text="${s.id_usuario}"></td>

                <td class="acciones">

                    <!-- EDITAR -->
                    <button type="button"

                            th:attr="
                                data-id=${s.id_servicio},
                                data-nombre=${s.nombre_servicio},
                                data-telefono=${s.telefono},
                                data-descripcion=${s.descripcion},
                                data-fecha=${s.fecha_creacion},
                                data-usuario=${s.id_usuario}"

                            onclick="openEditServicioModal(this)"

                            class="btn btn-warning">

                        <i class="bi bi-pencil-square"></i>
                    </button>

                    <!-- ELIMINAR -->
                    <button type="button"

                            th:data-url="@{'/servicioscrud/eliminar/' + ${s.id_servicio}}"

                            onclick="openDeleteModal(this.getAttribute('data-url'))"

                            class="btn btn-danger">

                        <i class="bi bi-trash"></i>
                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- BUSCADOR JS -->
<script>

    function buscarServicio() {

        let input = document.getElementById("buscarId").value;

        let filas = document.querySelectorAll("tbody tr");

        filas.forEach(fila => {

            let id = fila.children[0].textContent;

            if (id === input || input === "") {

                fila.style.display = "";

            } else {

                fila.style.display = "none";
            }
        });
    }

</script>

<!-- MODAL ELIMINAR -->
<div id="deleteModal" class="modal">

    <div class="modal-content"
         style="max-width: 400px; text-align: center;">

        <span class="close"
              onclick="closeDeleteModal()">

            &times;
        </span>

        <h2>¿Eliminar servicio?</h2>

        <p>
            Esta acción no se puede deshacer.
        </p>

        <div style="
            display:flex;
            justify-content:center;
            gap:15px;">

            <button type="button"
                    class="btn-cancel"
                    onclick="closeDeleteModal()">

                Cancelar
            </button>

            <a id="confirmDeleteBtn" href="#">

                <button type="button"
                        class="btn btn-danger"

                        onclick="
                        window.location.href=
                        document.getElementById('confirmDeleteBtn')
                        .getAttribute('data-url')">

                    Sí, eliminar
                </button>

            </a>

        </div>

    </div>

</div>

<!-- MODAL EDITAR -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <span class="close"
              onclick="closeEditModal()">

            &times;
        </span>

        <h2>Editar Servicio</h2>

        <form th:action="@{/servicioscrud/guardar}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   id="edit-id"
                   name="id_servicio">

            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input type="text"
                       id="edit-nombre"
                       name="nombre_servicio"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Teléfono
                </label>

                <input type="number"
                       id="edit-telefono"
                       name="telefono"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Descripción
                </label>

                <textarea id="edit-descripcion"
                          name="descripcion"
                          class="form-control"></textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Fecha creación
                </label>

                <input type="date"
                       id="edit-fecha"
                       name="fecha_creacion"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    ID Usuario
                </label>

                <input type="number"
                       id="edit-usuario"
                       name="id_usuario"
                       class="form-control">

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Actualizar Servicio
            </button>

        </form>

    </div>

</div>

<!-- JS MODAL EDITAR -->
<script>

    function openEditServicioModal(button) {

        document.getElementById("edit-id").value =
            button.getAttribute("data-id");

        document.getElementById("edit-nombre").value =
            button.getAttribute("data-nombre");

        document.getElementById("edit-telefono").value =
            button.getAttribute("data-telefono");

        document.getElementById("edit-descripcion").value =
            button.getAttribute("data-descripcion");

        document.getElementById("edit-fecha").value =
            button.getAttribute("data-fecha");

        document.getElementById("edit-usuario").value =
            button.getAttribute("data-usuario");

        document.getElementById("editModal").style.display = "block";
    }

</script>

<script th:src="@{/Modal.js}"></script>

</body>
</html>
