<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Administrar Publicaciones</title>
    <link rel='stylesheet' type='text/css' media='screen' href='administrarPublicacion.css'>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<header class="main-header">
    <div class="logo">Vive Flores</div>

    <nav>
        <a th:href="@{/}"><i class="bi bi-house"></i> Inicio</a>
        <a th:href="@{/mensajes}"><i class="bi bi-chat"></i> Mensajes</a>
        <a th:href="@{/adminpublicaciones}"><i class="bi bi-folder"></i> Administrar</a>
    </nav>
</header>

<section class="publicaciones">
    <div class="publi-container">

        <div th:each="p : ${publicaciones}" class="card-publicacion">

            <!-- IMAGEN -->
            <div class="img-container">
                <img th:src="@{'/adminpublicaciones/imagen/' + ${p.id_publicacion}}"
                     onerror="this.style.display='none'">
                <div th:if="${p.foto == null}" class="no-img">
                    <i class="bi bi-image"></i>
                </div>
            </div>

            <!-- INFO -->
            <div class="contenido">

                <div class="header-card">
                    <h2 th:text="${p.nombre_publicacion}">Nombre</h2>
                    <span class="estado"
                          th:text="${p.estado_publicacion}"
                          th:classappend="' ' + ${p.estado_publicacion}">
</span>
                </div>

                <p class="descripcion" th:text="${p.descripcion}"></p>

                <div class="datos">
                    <span><i class="bi bi-geo-alt"></i> <span th:text="${p.direccion}"></span></span>
                    <span><i class="bi bi-telephone"></i> <span th:text="${p.telefono}"></span></span>
                    <span><i class="bi bi-clock"></i> <span th:text="${p.horario}"></span></span>
                </div>

                <div class="acciones">

                    <a th:href="@{'/adminpublicaciones/editar/' + ${p.id_publicacion}}">
                        <button class="btn btn-warning">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </a>

                    <a th:href="@{'/adminpublicaciones/eliminar/' + ${p.id_publicacion}}">
                        <button class="btn btn-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </a>

                </div>

            </div>

        </div>

    </div>
</section>

</body>
</html>
