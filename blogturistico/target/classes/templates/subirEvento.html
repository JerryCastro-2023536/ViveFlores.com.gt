<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Subir Evento - Vive Flores</title>

    <link rel="stylesheet" th:href="@{/Styles/SubirEvento.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments :: headerVendedor}"></div>

<div class="container-evento">

    <div class="evento-card">

        <h2 class="title">
            Publicar Evento
        </h2>

        <p class="subtitle">
            Comparte un nuevo evento turístico.
        </p>

        <!-- MENSAJES -->
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/subirevento/guardar}"
              th:object="${evento}"
              method="post"
              enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">
                    Nombre del Evento
                </label>

                <input type="text"
                       th:field="*{nombre_evento}"
                       class="form-control input-custom"
                       placeholder="Nombre de Evento"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Descripción
                </label>

                <textarea th:field="*{descripcion}"
                          class="form-control input-custom textarea-custom"
                          rows="5"
                          placeholder="Describe el evento..."
                          required></textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Fotografía
                </label>

                <input type="file"
                       name="archivo"
                       class="form-control input-custom"
                       accept="image/*">

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Fecha de Inicio
                    </label>

                    <input type="datetime-local"
                           th:field="*{fecha_inicio}"
                           class="form-control input-custom"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Fecha de Finalización
                    </label>

                    <input type="datetime-local"
                           th:field="*{fecha_fin}"
                           class="form-control input-custom"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Ubicación
                </label>

                <input type="text"
                       th:field="*{ubicacion}"
                       class="form-control input-custom"
                       placeholder="Lugar del Evento"
                       required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    ID Usuario
                </label>

                <input type="number"
                       th:field="*{id_usuario}"
                       class="form-control input-custom"
                       placeholder="Ingrese el ID del usuario"
                       required>

            </div>

            <button type="submit" class="btn-submit">
                Publicar Evento
            </button>

        </form>

    </div>

</div>

</body>
</html>
