<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Login</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='Login.css'>
</head>
<body>
    <header>
        <div class="logo">Isla de Flores</div>
            <nav>
                <ul>
                    <li><a href="index">Inicio</a></li>
                    <li><a href="perfil">Ir al perfil</a></li>
                    <li><a href="#">Eventos</a></li>
                    <li><a href="#">Servicios</a></li>
                    <li><a href="quienessomos">¿Quienes Somos?</a></li>
                    <li><a href="contacto">Contacto</a></li>
                    <li><a href="#">Conviertete en vendedor</a></li>
                </ul>
            </nav>
            <a href="registro"><button class="btn-register">Registrate</button></a>
        </div>
    </header>

    <section class="login-container">

        <div class="login-card">
            <h2>Bienvenido</h2>
            <form th:action="@{/login}" method="post">
                <input type="text" placeholder="Usuario o correo" name="username" required>
                <input type="password" placeholder="Contraseña" name="contrasena" required>
                <div th:if="${errorMessage}" style="color: red;">
                    <p th:text="${errorMessage}"></p>
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            <p class="register-text">
                No tienes cuenta? <a href="registro">Crea una</a>
            </p>
        </div>

        <div class="login-image">
            <img src="islaLogin.jpg">
        </div>

    </section>
</body>
</html>
