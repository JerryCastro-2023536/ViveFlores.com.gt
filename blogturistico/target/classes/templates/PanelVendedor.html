<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Panel Vendedor</title>
    <link rel='stylesheet' type='text/css' media='screen' href="PanelVendedor.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments :: headerVendedor}"></div>

<div class="container">

    <h2 class="titulo">Panel de Vendedor</h2>
    <p class="subtitulo">Administra tus publicaciones y mensajes en Vive Flores</p>

    <div class="panel-grid">

        <a th:href="@{/vendedor/subir}" class="card-panel">
            <i class="bi bi-upload icono"></i>
            <h3>Subir Publicación</h3>
        </a>

        <a th:href="@{/mensajes}" class="card-panel">
            <i class="bi bi-chat-dots icono"></i>
            <h3>Mensajes</h3>
        </a>

        <a th:href="@{/adminpublicaciones}" class="card-panel">
            <i class="bi bi-folder-check icono"></i>
            <h3>Mis Publicaciones</h3>
        </a>

    </div>

</div>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
