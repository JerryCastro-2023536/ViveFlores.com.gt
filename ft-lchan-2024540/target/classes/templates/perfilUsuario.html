<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Perfil - Vive Flores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/index.css(v=1.2)}">
    <link rel="stylesheet" th:href="@{/perfilUsuario.css(v=1.2)}">
</head>
<body>

    <header>
        <div class="logo">Vive Flores</div>
        <nav>
            <ul>
                <li><a th:href="@{/index}">Inicio</a></li>
                <li><a th:href="@{/favoritas}">Favoritos</a></li>
                <li><a href="#" onclick="document.getElementById('modalEditar').style.display='flex'">Editar Perfil</a></li>
                <li th:if="${session.usuarioLogueado != null and #strings.equalsIgnoreCase(session.usuarioLogueado.rol, 'usuario')}">
                    <a th:href="@{/vendedor}">Conviértete en vendedor</a>
                </li>
            </ul>
        </nav>
        <div class="user-actions">
            <a th:if="${session.usuarioLogueado != null}" th:href="@{/logout}"><button class="btn-login" style="background-color: #e74c3c; color: white;">Cerrar Sesión</button></a>
            <a th:if="${session.usuarioLogueado == null}" th:href="@{/acceder}"><button class="btn-login">Iniciar Sesión</button></a>
        </div>
    </header>
    
    <section class="section alt profile-section">
        <h2 class="reveal visible">Tu Perfil</h2>

        <div class="profile-container reveal visible">
            <div class="profile-content">
                <h1 th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre_usuario + ' ' + session.usuarioLogueado.apellido_usuario : 'Nombre de Usuario'}">Nombre completo</h1>
                <p><strong>Usuario:</strong> <span th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.username : '-'}"></span></p>
                <p><strong>Email:</strong> <span th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.email_usuario : '-'}"></span></p>
                <p><strong>Fecha de Registro:</strong> <span th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.fecha_registro : '-'}"></span></p>
            </div>
            <div class="profile-img">
                <i class="bi bi-person-circle"></i>
            </div>
        </div>

        <div class="profile-buttons reveal visible">
            <button onclick="document.getElementById('modalEditar').style.display='flex'"><i class="bi bi-pencil-fill"></i> Editar Perfil</button>
            <input type="file" id="file" class="input-file" style="display: none;">
            <label for="file" class="btn-file"><i class="bi bi-image-fill"></i> Cambiar imagen</label>
        </div>
    </section>

    <div class="modal-overlay" id="modalEditar" style="display: none;">
        <div class="modal-content">
            <a href="#" onclick="document.getElementById('modalEditar').style.display='none'" class="close">&times;</a>
            <h2>Editar Perfil</h2>
            <form th:action="@{/editarPerfil}" method="post" style="flex-direction: column;">
                <label>Username:</label>
                <input type="text" name="username" th:value="${session.usuarioLogueado != null ? session.usuarioLogueado.username : ''}" class="form-control">
                
                <label>Nombre:</label>
                <input type="text" name="nombre_usuario" th:value="${session.usuarioLogueado != null ? session.usuarioLogueado.nombre_usuario : ''}" class="form-control">
                
                <label>Apellido:</label>
                <input type="text" name="apellido_usuario" th:value="${session.usuarioLogueado != null ? session.usuarioLogueado.apellido_usuario : ''}" class="form-control">
                
                <label>Correo:</label>
                <input type="email" name="correo" th:value="${session.usuarioLogueado != null ? session.usuarioLogueado.email_usuario : ''}" class="form-control">
                
                <button type="submit" class="btn-submit">Guardar Cambios</button>
            </form>
        </div>
    </div>

</body>
</html>
