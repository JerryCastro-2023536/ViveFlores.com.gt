<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vive Flores - Registro de Vendedor</title>
    <link rel="stylesheet" href="/css/estilos.css"           th:href="@{/css/estilos.css}"/>
    <link rel="stylesheet" href="/css/registroVendedor.css" th:href="@{/css/registroVendedor.css}"/>
</head>
<body>

<nav>
    <span class="brand">Vive Flores</span>
    <a class="btn-back" href="/">&#8592; Volver al inicio</a>
</nav>

<div class="container">
    <h1>Registro de Vendedor</h1>

    <div class="card">
        <form th:action="@{/vendedores/guardar}" method="post" id="vendedorForm">

            <!-- Nombre y Apellidos -->
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre(s)</label>
                    <input type="text" name="nombre" placeholder="Nombre(s)" required/>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" name="apellidos" placeholder="Apellido(s)" required/>
                </div>
            </div>

            <!-- Teléfono y Correo -->
            <div class="form-row">
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" name="telefono" placeholder="+502 0000 0000" required/>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="correo" placeholder="correo@ejemplo.com" required/>
                </div>
            </div>

            <!-- Contraseñas -->
            <div class="form-row">
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-password">
                        <input type="password" id="passInput" name="contrasena"
                               placeholder="Mínimo 8 caracteres" required/>
                        <button type="button" class="toggle-pass"
                                onclick="togglePass('passInput', this)" title="Mostrar contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-wrapper" id="strengthWrapper" style="display:none;">
                        <div class="strength-bar">
                            <span id="s1"></span><span id="s2"></span>
                            <span id="s3"></span><span id="s4"></span>
                        </div>
                        <p id="strengthLabel"></p>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <div class="input-password">
                        <input type="password" id="passConfirm" name="confirmar_contrasena"
                               placeholder="Repite la contraseña" required/>
                        <button type="button" class="toggle-pass"
                                onclick="togglePass('passConfirm', this)" title="Mostrar contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17"
                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <p class="match-msg" id="matchMsg"></p>
                </div>
            </div>

            <!-- Acciones -->
            <div class="form-actions">
                <a href="/" class="btn-cancel">Cancelar</a>
                <button type="submit" class="btn-save">Registrar Vendedor</button>
            </div>

        </form>
    </div>
</div>

<script>
    function togglePass(inputId, btn) {
        const input  = document.getElementById(inputId);
        const isText = input.type === 'text';
        input.type   = isText ? 'password' : 'text';
        btn.classList.toggle('active', !isText);
        checkMatch();
    }

    document.getElementById('passInput').addEventListener('input', function () {
        const val     = this.value;
        const wrapper = document.getElementById('strengthWrapper');
        wrapper.style.display = val.length ? 'block' : 'none';

        let strength = 0;
        if (val.length >= 8)          strength++;
        if (/[A-Z]/.test(val))        strength++;
        if (/[0-9]/.test(val))        strength++;
        if (/[^A-Za-z0-9]/.test(val)) strength++;

        const colors = ['#e74c3c', '#e67e22', '#f6b93b', '#27ae60'];
        const labels = ['Muy débil', 'Débil', 'Regular', 'Fuerte'];

        ['s1','s2','s3','s4'].forEach((id, i) => {
            document.getElementById(id).style.background =
                i < strength ? colors[strength - 1] : '#e0e0e0';
        });
        const lbl        = document.getElementById('strengthLabel');
        lbl.textContent  = val.length ? (labels[strength - 1] || '') : '';
        lbl.style.color  = strength ? colors[strength - 1] : '#aaa';
        checkMatch();
    });

    document.getElementById('passConfirm').addEventListener('input', checkMatch);

    function checkMatch() {
        const p1  = document.getElementById('passInput').value;
        const p2  = document.getElementById('passConfirm').value;
        const msg = document.getElementById('matchMsg');
        if (!p2) { msg.textContent = ''; msg.className = 'match-msg'; return; }
        if (p1 === p2) {
            msg.textContent = '✓ Las contraseñas coinciden';
            msg.className   = 'match-msg match-ok';
        } else {
            msg.textContent = '✗ No coinciden';
            msg.className   = 'match-msg match-fail';
        }
    }

    document.getElementById('vendedorForm').addEventListener('submit', function (e) {
        if (document.getElementById('passInput').value !==
            document.getElementById('passConfirm').value) {
            e.preventDefault();
            document.getElementById('passConfirm').focus();
        }
    });
</script>

</body>
</html>
