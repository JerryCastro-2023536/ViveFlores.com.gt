<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CRUD Eventos</title>
    <link rel="stylesheet" th:href="@{/Styles/EventosCrud.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<header>
    <div class="logo">Vive Flores</div>
    <nav>
        <a th:href="@{/}" class="btn-home">⬅ Volver al inicio</a>
    </nav>
</header>

<div class="container">

    <h2 class="titulo">Gestión de Eventos</h2>

    <!-- FORMULARIO -->
    <div class="form-container">
        <form th:action="@{/eventoscrud/guardar}"
              th:object="${evento}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id_evento}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre_evento}" required>
                </div>

                <div class="form-group full">
                    <label>Descripción</label>
                    <textarea th:field="*{descripcion}" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label>Foto</label>
                    <input type="file" name="archivo">
                </div>

                <div class="form-group">
                    <label>Ubicación</label>
                    <input type="text" th:field="*{ubicacion}" required>
                </div>

                <div class="form-group">
                    <label>Fecha Inicio</label>
                    <input type="datetime-local" th:field="*{fecha_inicio}" required>
                </div>

                <div class="form-group">
                    <label>Fecha Fin</label>
                    <input type="datetime-local" th:field="*{fecha_fin}" required>
                </div>

                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" th:field="*{id_usuario}" required>
                </div>

            </div>

            <button type="submit">Guardar</button>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="mb-4 d-flex justify-content-center gap-2">
        <input type="number" id="buscarId" placeholder="Buscar por ID"
               class="form-control" style="max-width: 300px;">

        <button onclick="buscarEvento()" class="btn btn-dark">
            <i class="bi bi-search"></i>
        </button>
    </div>

    <!-- TABLA -->
    <div class="tabla-container">
        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Ubicación</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Usuario</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="e : ${eventos}">

                <td th:text="${e.id_evento}"></td>
                <td th:text="${e.nombre_evento}"></td>
                <td th:text="${e.descripcion}"></td>
                <td th:text="${e.ubicacion}"></td>
                <td th:text="${e.fecha_inicio}"></td>
                <td th:text="${e.fecha_fin}"></td>
                <td th:text="${e.id_usuario}"></td>

                <td class="acciones">
                    <a th:href="@{'/eventoscrud/editar/' + ${e.id_evento}}">
                        <button type="button" class="btn btn-warning">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </a>

                    <a th:href="@{'/eventoscrud/eliminar/' + ${e.id_evento}}">
                        <button type="button" class="btn btn-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </a>
                </td>

            </tr>
            </tbody>

        </table>
    </div>

</div>

<script>
    function buscarEvento() {
        let input = document.getElementById("buscarId").value;
        let filas = document.querySelectorAll("tbody tr");

        filas.forEach(fila => {
            let id = fila.children[0].textContent;

            if (id === input || input === "") {
                fila.style.display = "";
            } else {
                fila.style.display = "none";
            }
        });
    }
</script>

</body>
</html>
