<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error - Vive Flores</title>

    <link rel="stylesheet" th:href="@{/Styles/Error.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header class="header">
    <div class="logo">Vive Flores</div>
    <a th:href="@{/}" class="btn-home">Volver</a>
</header>

<div class="container-error">

    <div class="error-card">

        <div class="svg-container">

            <svg viewBox="0 0 800 300" class="not_found_svg">

                <!-- CIELO -->
                <rect width="800" height="300" fill="#1a2e3f"/>

                <!-- NUBES -->
                <g id="cloud1">
                    <ellipse cx="150" cy="60" rx="40" ry="20" fill="#fcf5e3"/>
                </g>

                <g id="cloud2">
                    <ellipse cx="500" cy="80" rx="50" ry="25" fill="#fcf5e3"/>
                </g>

                <!-- MAR -->
                <g id="waves">
                    <path d="
                            M0 200 Q50 180 100 200 T200 200 T300 200 T400 200 T500 200 T600 200 T700 200 T800 200
                            T900 200 T1000 200 T1100 200 T1200 200 T1300 200 T1400 200 T1500 200 T1600 200
                            V300 H0 Z"
                          fill="#5d89af"/>
                </g>

                <!-- BARCO -->
                <g id="boat">
                    <!-- base -->
                    <path d="M350 180 Q370 200 430 200 Q450 200 450 180 Z"
                          fill="#f6b93b"
                          stroke="#d89c2f"
                          stroke-width="2"/>

                    <!-- mástil -->
                    <rect x="395" y="120" width="5" height="50" fill="#fff"/>

                    <!-- vela -->
                    <polygon points="400,120 450,170 400,170" fill="#ffffff"/>
                </g>

            </svg>

        </div>

        <h1 class="error-code" th:text="${status}">500</h1>

        <h2 class="error-title">
            Algo salió mal en el lago...
        </h2>

        <p class="error-message" th:text="${error}">
            Error interno del servidor
        </p>

        <a th:href="@{/}" class="btn-back">
            Volver
        </a>

    </div>

</div>

</body>
</html>
