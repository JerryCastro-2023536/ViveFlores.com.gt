<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CRUD Servicios</title>
    <link rel="stylesheet" th:href="@{/Styles/EventosCrud.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>
    <div class="logo">Vive Flores</div>
    <nav>
        <a th:href="@{/}" class="btn-home">⬅ Volver al inicio</a>
    </nav>
</header>

<div class="container">

    <h2 class="titulo">Gestión de Servicios</h2>

    <!-- FORMULARIO -->
    <div class="form-container">
        <form th:action="@{/servicioscrud/guardar}"
              th:object="${servicio}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id_servicio}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre_servicio}" required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="number" th:field="*{telefono}" required>
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" th:field="*{descripcion}" required>
                </div>

                <div class="form-group">
                    <label>Foto</label>
                    <input type="file" name="archivo">
                </div>

                <div class="form-group">
                    <label>Fecha de Creación</label>
                    <input type="date" th:field="*{fecha_creacion}" required>
                </div>

                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" th:field="*{id_usuario}" required>
                </div>

            </div>

            <button type="submit">Guardar</button>
        </form>
    </div>
    <div class="mb-4 text-center">
        <input type="number" id="buscarId" placeholder="Buscar por ID"
               class="form-control w-25 d-inline">
        <button onclick="buscarServicio()" class="btn btn-dark ms-2">
            <i class="bi bi-search"></i>
        </button>
    </div>

    <!-- TABLA -->
    <div class="tabla-container">
        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${servicios}">

                <td th:text="${s.id_servicio}"></td>
                <td th:text="${s.nombre_servicio}"></td>
                <td th:text="${s.telefono}"></td>
                <td th:text="${s.descripcion}"></td>
                <td th:text="${s.fecha_creacion}"></td>
                <td th:text="${s.id_usuario}"></td>

                <td class="acciones">
                    <a th:href="@{'/servicioscrud/editar/' + ${s.id_servicio}}">
                        <button type="button" class="btn btn-warning">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                    </a>

                    <a th:href="@{'/servicioscrud/eliminar/' + ${s.id_servicio}}">
                        <button type="button" class="btn btn-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </a>
                </td>

            </tr>
            </tbody>

        </table>
    </div>

</div>
<script>
    function buscarServicio() {
        let input = document.getElementById("buscarId").value;
        let filas = document.querySelectorAll("tbody tr");

        filas.forEach(fila => {
            let id = fila.children[0].textContent;

            if (id === input || input === "") {
                fila.style.display = "";
            } else {
                fila.style.display = "none";
            }
        });
    }
</script>

</body>
</html>
