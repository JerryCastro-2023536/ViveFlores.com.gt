<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CRUD Servicios</title>
    <link rel="stylesheet" th:href="@{/Styles/ServiciosCrud.css}">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">Vive Flores</div>
    <nav>
        <a href="PaginaPrincipal.html" class="btn-home">⬅ Volver al inicio</a>
    </nav>
</header>

<!-- CONTENEDOR GENERAL -->
<div class="container">

    <h2 class="titulo">Gestión de Servicios</h2>

    <!-- FORMULARIO -->
    <div class="form-container">
        <form th:action="@{/servicioscrud/guardar}" th:object="${servicio}" method="post" enctype="multipart/form-data">

            <input type="hidden" th:field="*{id_servicio}">

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre_servicio}" required>
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <input type="text" th:field="*{descripcion}" required>
                </div>

                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="number" th:field="*{telefono}" required>
                </div>

                <div class="form-group">
                    <label>Foto</label>
                    <input type="file" name="archivo">
                </div>

                <div class="form-group">
                    <label>Fecha de Creación</label>
                    <input type="date" th:field="*{fecha_creacion}" required>
                </div>

                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" th:field="*{id_usuario}" required>
                </div>

            </div>

            <button type="submit">Guardar</button>
        </form>
    </div>

    <!-- TABLA -->
    <div class="tabla-container">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Teléfono</th>
                <th>Foto</th>
                <th>Fecha de Creación</th>
                <th>Id de Usuario</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${servicios}">
                <td th:text="${s.id_servicio}"></td>
                <td th:text="${s.nombre_servicio}"></td>
                <td th:text="${s.descripcion}"></td>
                <td th:text="${s.telefono}"></td>
                <td th:text="${s.foto}"></td>
                <td th:text="${s.fecha_creacion}"></td>
                <td th:text="${s.id_usuario}"></td>

                <td class="acciones">
                    <a th:href="@{'/servicioscrud/editar/' + ${s.id_servicio}}">
                        <button class="btn-editar">Editar</button>
                    </a>

                    <a th:href="@{'/servicioscrud/eliminar/' + ${s.id_servicio}}">
                        <button class="btn-eliminar">Eliminar</button>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
